<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="app-name" content="Base64 Gzip">
    <meta name="app-section" content="Tools">
    <title>Base64 Gzip</title>
    <meta name="description" content="Unpack base64 gzip text, or pack text into it. Everything stays on your device.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-raised: #1c1c1c;
            --text-primary: #e5e5e5;
            --text-secondary: #a3a3a3;
            --text-muted: #737373;
            --accent: #10b981;
            --accent-hover: #34d399;
            --accent-soft: rgba(16, 185, 129, 0.15);
            --border: #262626;
            --border-strong: #3a3a3a;
            --code-bg: #121212;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            --border-radius: 8px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            overflow-x: clip;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 15px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-hover); }

        .site-nav {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            max-width: 900px;
            margin: 0 auto;
            flex-wrap: wrap;
        }

        .nav-brand { font-weight: 600; color: var(--text-primary); font-size: 1.125rem; }
        .nav-brand:hover { color: var(--accent); }

        .container { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 3rem; }

        .page-head h1 { font-size: 1.125rem; font-weight: 600; margin: 0 0 0.25rem; }
        .subtitle { color: var(--text-secondary); margin: 0 0 1.5rem; }

        button, .btn {
            font: inherit;
            font-size: 0.875rem;
            color: var(--text-primary);
            background: var(--bg-raised);
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            padding: 0.45rem 0.75rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover, .btn:hover { border-color: var(--text-muted); }
        button:disabled { opacity: 0.4; cursor: default; }
        button:disabled:hover { border-color: var(--border-strong); }

        .btn-primary { background: var(--accent); border-color: var(--accent); color: #04140d; font-weight: 600; }
        .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

        button[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-hover); }

        .hint { color: var(--text-muted); font-size: 0.85rem; margin: 0; }
        .msg { font-size: 0.9rem; color: #fbbf24; margin: 0; }
        .msg:empty { display: none; }

        input[type=file] { display: none; }
        [hidden] { display: none !important; }

        /* ---------- Decode | Encode ---------- */

        .tabs {
            display: inline-flex;
            margin-bottom: 1rem;
            border: 1px solid var(--border-strong);
            border-radius: var(--border-radius);
            overflow: hidden;
        }

        .tabs button {
            border: none;
            border-radius: 0;
            background: transparent;
            color: var(--text-secondary);
            padding: 0.5rem 1.1rem;
        }

        .tabs button + button { border-left: 1px solid var(--border-strong); }
        .tabs button:hover { color: var(--text-primary); }
        .tabs button[aria-selected=true] { background: var(--accent); color: #04140d; font-weight: 600; }

        .panel { display: flex; flex-direction: column; gap: 0.75rem; }

        textarea {
            width: 100%;
            min-height: 170px;
            resize: vertical;
            padding: 0.75rem 0.9rem;
            font: 13px/1.55 var(--mono);
            color: var(--text-primary);
            background: var(--bg-secondary);
            border: 1px solid var(--border-strong);
            border-radius: var(--border-radius);
            outline: none;
            caret-color: var(--accent);
        }

        /* base64 is one long word, so it may break anywhere; text in Encode breaks between words */
        #in { word-break: break-all; }

        textarea::placeholder { color: var(--text-muted); }
        textarea:focus, textarea.dragover { border-color: var(--accent); }

        .row { display: flex; gap: 0.5rem; flex-wrap: wrap; }

        /* ---------- what came out ---------- */

        .result { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.5rem; }

        .result-bar { display: flex; align-items: center; gap: 0.5rem 0.75rem; flex-wrap: wrap; }
        .meta { flex: 1 1 auto; min-width: 0; color: var(--text-secondary); font-size: 0.875rem; overflow-wrap: anywhere; }
        .actions { display: flex; gap: 0.5rem; }

        .out {
            margin: 0;
            padding: 0.9rem 1rem;
            font: 13px/1.55 var(--mono);
            color: var(--text-primary);
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            max-height: 70vh;
            overflow: auto;
            white-space: pre;
            tab-size: 2;
        }

        .out.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
        .out.b64 { white-space: pre-wrap; word-break: break-all; }

        .preview {
            align-self: flex-start;
            max-width: 100%;
            height: auto;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: repeating-conic-gradient(#1c1c1c 0 25%, #141414 0 50%) 0 0 / 16px 16px;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            z-index: 40;
            max-width: calc(100vw - 48px);
            padding: 0.6rem 0.9rem;
            background: var(--bg-raised);
            border: 1px solid var(--border-strong);
            border-radius: var(--border-radius);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            font-size: 0.875rem;
        }

        @media (max-width: 600px) {
            .site-nav { padding: 1rem 24px; }
            .container { padding: 1.5rem 24px 2.5rem; }
        }
    </style>
</head>
<body>
    <nav class="site-nav"><a href="/" class="nav-brand">Maheshkumar</a></nav>

    <main class="container">
        <header class="page-head">
            <h1>Base64 Gzip</h1>
            <p class="subtitle">Unpack base64 gzip text, or pack text into it. Everything stays on your device.</p>
        </header>

        <div class="tabs" role="tablist" aria-label="Mode">
            <button type="button" role="tab" id="tab-decode" aria-selected="true" aria-controls="decode">Decode</button>
            <button type="button" role="tab" id="tab-encode" aria-selected="false" aria-controls="encode" tabindex="-1">Encode</button>
        </div>

        <section class="panel" id="decode" role="tabpanel" aria-labelledby="tab-decode">
            <textarea id="in" placeholder="Paste base64 here, or drop a file" aria-label="Base64 text" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
            <div class="row">
                <label class="btn" for="file">Open a file</label>
                <input type="file" id="file">
                <button type="button" id="clear" disabled>Clear</button>
            </div>
            <p class="msg" id="msg" role="status"></p>
            <div class="result" id="result" hidden>
                <div class="result-bar">
                    <span class="meta" id="meta"></span>
                    <div class="actions">
                        <button type="button" id="wrap" aria-pressed="true">Wrap</button>
                        <button type="button" id="copy">Copy</button>
                        <button type="button" class="btn-primary" id="save">Save</button>
                    </div>
                </div>
                <p class="hint" id="note" hidden></p>
                <pre class="out wrap" id="out"></pre>
                <img class="preview" id="img" alt="The unpacked image" hidden>
            </div>
        </section>

        <section class="panel" id="encode" role="tabpanel" aria-labelledby="tab-encode" hidden>
            <textarea id="plain" placeholder="Type or paste text here" aria-label="Text to pack" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
            <div class="row">
                <button type="button" id="clear2" disabled>Clear</button>
            </div>
            <p class="msg" id="msg2" role="status"></p>
            <div class="result" id="result2" hidden>
                <div class="result-bar">
                    <span class="meta" id="meta2"></span>
                    <div class="actions">
                        <button type="button" id="copy2">Copy</button>
                        <button type="button" class="btn-primary" id="save2">Save</button>
                    </div>
                </div>
                <p class="hint" id="note2" hidden></p>
                <pre class="out b64" id="out2"></pre>
            </div>
        </section>
    </main>

    <div class="toast" id="toast" role="status" hidden></div>

    <script>
        // Everything happens here, in the browser: nothing typed or opened is sent anywhere,
        // and nothing is kept after the page closes.

        const $ = id => document.getElementById(id);

        const SHOW_LIMIT = 1 << 20;            // characters drawn on screen; Copy and Save get everything
        const UNPACK_LIMIT = 100 * 1024 * 1024; // stop past this, so a tiny "zip bomb" can't freeze the phone
        const PRETTY_LIMIT = 20 * 1024 * 1024;  // bigger JSON is shown as it came

        /** A problem with what was pasted, in words for the reader. */
        class Problem extends Error {}

        function sizeText(n) {
            if (n < 1024) return `${n} B`;
            const kb = n / 1024;
            if (kb < 1024) return `${kb < 10 ? kb.toFixed(1) : Math.round(kb)} KB`;
            const mb = kb / 1024;
            return `${mb < 10 ? mb.toFixed(1) : Math.round(mb)} MB`;
        }

        let toastTimer;
        function toast(text) {
            const t = $('toast');
            t.textContent = text;
            t.hidden = false;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { t.hidden = true; }, 2500);
        }

        // ---------- base64 ----------

        /**
         * The bytes in base64 text. Copes with what usually comes along with it: spaces and line
         * breaks, quotes around it, a "data:…;base64," start, \n and \/ from JSON, URL-safe - and _,
         * and missing = at the end.
         */
        function fromBase64(text) {
            let s = text.trim();
            if (/^data:/i.test(s) && s.includes(',')) s = s.slice(s.indexOf(',') + 1);
            const quoted = s.match(/^(["'`])([\s\S]*)\1$/);
            if (quoted) s = quoted[2];
            s = s.replace(/\\[nrt]/g, '').replace(/\\\//g, '/').replace(/\s+/g, '')
                .replace(/-/g, '+').replace(/_/g, '/').replace(/=+$/, '');
            const bad = s.match(/[^A-Za-z0-9+/]/);
            if (bad) throw new Problem(`This isn’t base64. It has “${bad[0]}” in it.`);
            if (s.length % 4 === 1) throw new Problem('This base64 is one letter off. Part of it may be missing.');
            const bin = atob(s + '='.repeat((4 - s.length % 4) % 4));
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return bytes;
        }

        // Big inputs are turned into text a piece at a time, since one huge call can run out of room.
        function toBase64(bytes) {
            let s = '';
            for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
            return btoa(s);
        }

        // ---------- gzip ----------

        const isGzip = b => b.length >= 2 && b[0] === 0x1f && b[1] === 0x8b;
        // zlib is gzip's close cousin (same packing, different wrapper), so it's opened too.
        const isZlib = b => b.length >= 2 && (b[0] & 0x0f) === 8 && (b[0] >> 4) <= 7 && ((b[0] << 8) | b[1]) % 31 === 0;

        /**
         * Unpacks with the browser's own unzipper. When the data is cut short or damaged, whatever
         * came out before the problem is kept, since a log often cuts long base64 off at the end.
         */
        async function unpack(bytes, format) {
            const reader = new Blob([bytes]).stream().pipeThrough(new DecompressionStream(format)).getReader();
            const parts = [];
            let total = 0, damaged = false, tooBig = false;
            try {
                for (;;) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    parts.push(value);
                    total += value.length;
                    if (total > UNPACK_LIMIT) {
                        tooBig = true;
                        reader.cancel().catch(() => {});
                        break;
                    }
                }
            } catch {
                damaged = true;
            }
            const out = new Uint8Array(total);
            let at = 0;
            for (const p of parts) { out.set(p, at); at += p.length; }
            return { bytes: out, damaged, tooBig };
        }

        async function pack(text) {
            const stream = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
            return new Uint8Array(await new Response(stream).arrayBuffer());
        }

        // ---------- what the unpacked bytes are ----------

        const FILES = [
            { sig: [0x89, 0x50, 0x4e, 0x47], label: 'PNG image', ext: 'png', type: 'image/png', image: true },
            { sig: [0xff, 0xd8, 0xff], label: 'JPEG image', ext: 'jpg', type: 'image/jpeg', image: true },
            { sig: [0x47, 0x49, 0x46, 0x38], label: 'GIF image', ext: 'gif', type: 'image/gif', image: true },
            { sig: [0x52, 0x49, 0x46, 0x46], at8: [0x57, 0x45, 0x42, 0x50], label: 'WebP image', ext: 'webp', type: 'image/webp', image: true },
            { sig: [0x25, 0x50, 0x44, 0x46], label: 'PDF', ext: 'pdf', type: 'application/pdf' },
            { sig: [0x50, 0x4b, 0x03, 0x04], label: 'Zip file', ext: 'zip', type: 'application/zip' },
            { sig: [0x1f, 0x8b], label: 'Gzip file', ext: 'gz', type: 'application/gzip' },
        ];

        const startsWith = (b, sig, from = 0) => sig.every((v, i) => b[from + i] === v);

        /** Text has almost no control characters besides tabs and line breaks. Big text is judged by its start. */
        function mostlyLetters(text) {
            const n = Math.min(text.length, 1 << 20);
            let odd = 0;
            for (let i = 0; i < n; i++) {
                const c = text.charCodeAt(i);
                if (c < 32 && (c < 9 || c > 13)) odd++;
            }
            return odd <= n / 100;
        }

        /** Text, JSON, a known file, or plain bytes. */
        function describe(bytes, cutShort) {
            const file = FILES.find(f => startsWith(bytes, f.sig) && (!f.at8 || startsWith(bytes, f.at8, 8)));
            if (file) return { ...file, blob: new Blob([bytes], { type: file.type }) };

            let text = null;
            if (!bytes.includes(0)) {
                try {
                    // When cut short, the last letter may be half there: { stream: true } leaves it out.
                    text = new TextDecoder('utf-8', { fatal: true }).decode(bytes, { stream: cutShort });
                } catch { /* not text */ }
            }
            if (text === null || !mostlyLetters(text)) {
                return { label: 'File', ext: 'bin', type: 'application/octet-stream', blob: new Blob([bytes]) };
            }

            const start = text.trimStart()[0];
            if ((start === '{' || start === '[') && text.length <= PRETTY_LIMIT) {
                try {
                    const pretty = JSON.stringify(JSON.parse(text), null, 2);
                    return { label: 'JSON', ext: 'json', text: pretty, blob: new Blob([pretty], { type: 'application/json' }) };
                } catch { /* not JSON after all */ }
            }
            return { label: 'Text', ext: 'txt', text, blob: new Blob([bytes], { type: 'text/plain;charset=utf-8' }) };
        }

        // ---------- Decode ----------

        let shown = null;      // what Copy and Save use: { text?, blob, name }
        let fileName = '';     // the opened file, until the text is changed by hand
        let decodeRun = 0;
        let imageUrl = '';

        function resetDecode() {
            $('msg').textContent = '';
            $('result').hidden = true;
            $('out').textContent = '';
            $('img').hidden = true;
            $('img').removeAttribute('src');
            if (imageUrl) URL.revokeObjectURL(imageUrl);
            imageUrl = '';
            shown = null;
            $('clear').disabled = !$('in').value && !fileName;
        }

        /** "report.json.gz" → "report.json"; "payload.txt" → "payload.json". */
        function saveName(name, ext) {
            if (!name) return `unpacked.${ext}`;
            const base = name.replace(/\.(gz|gzip|b64|base64|txt)$/i, '');
            return /\.[a-z0-9]{1,5}$/i.test(base) ? base : `${base}.${ext}`;
        }

        async function decodeBytes(bytes, run) {
            const format = isGzip(bytes) ? 'gzip' : isZlib(bytes) ? 'deflate' : null;
            const got = format ? await unpack(bytes, format) : { bytes, damaged: false, tooBig: false };
            if (run !== decodeRun) return;
            if (format && got.damaged && !got.bytes.length) {
                throw new Problem(format === 'gzip' ? 'This gzip data is damaged or cut short.' : 'This zlib data is damaged or cut short.');
            }
            if (!got.bytes.length) throw new Problem('This unpacks to nothing: it’s empty.');

            const what = describe(got.bytes, got.damaged || got.tooBig);
            const meta = [what.label, sizeText(got.bytes.length)];
            if (format === 'deflate') meta.push('zlib, not gzip');
            if (!format) meta.push('not gzip, just base64');
            if (fileName) meta.push(fileName);
            $('meta').textContent = meta.join(' · ');

            if (got.tooBig) $('msg').textContent = `Stopped at ${sizeText(UNPACK_LIMIT)}. That’s as much as this page unpacks.`;
            else if (got.damaged) $('msg').textContent = 'The data is damaged or cut short. Showing the part that could be read.';

            shown = { text: what.text, blob: what.blob, name: saveName(fileName, what.ext) };
            const note = $('note');
            note.hidden = true;
            $('out').hidden = what.text === undefined;
            $('wrap').hidden = what.text === undefined;
            $('copy').hidden = what.text === undefined;
            if (what.text !== undefined) {
                const long = what.text.length > SHOW_LIMIT;
                $('out').textContent = long ? what.text.slice(0, SHOW_LIMIT) : what.text;
                if (long) {
                    note.textContent = `Showing the first ${sizeText(SHOW_LIMIT)}. Copy or Save to get all of it.`;
                    note.hidden = false;
                }
            } else if (what.image) {
                imageUrl = URL.createObjectURL(what.blob);
                $('img').src = imageUrl;
                $('img').hidden = false;
            } else {
                note.textContent = 'Save it to open it.';
                note.hidden = false;
            }
            $('result').hidden = false;
            $('clear').disabled = false;
        }

        async function decode(getBytes) {
            const run = ++decodeRun;
            resetDecode();
            try {
                const bytes = getBytes();
                if (!bytes) return;
                await decodeBytes(bytes, run);
            } catch (e) {
                if (run !== decodeRun) return;
                resetDecode();
                $('msg').textContent = e instanceof Problem ? e.message : `Couldn’t unpack this: ${e.message || e}`;
            }
        }

        function decodeTyped() {
            decode(() => ($('in').value.trim() ? fromBase64($('in').value) : null));
        }

        async function openFile(file) {
            if (!file) return;
            const bytes = new Uint8Array(await file.arrayBuffer());
            fileName = file.name;
            if (isGzip(bytes)) {
                // A .gz file itself: no base64 to read, so unpack it straight away.
                $('in').value = '';
                decode(() => bytes);
            } else {
                $('in').value = new TextDecoder().decode(bytes);
                decodeTyped();
            }
        }

        let typingTimer;
        $('in').addEventListener('input', () => {
            fileName = '';
            clearTimeout(typingTimer);
            typingTimer = setTimeout(decodeTyped, 150);
        });

        $('file').addEventListener('change', e => {
            openFile(e.target.files[0]);
            e.target.value = '';
        });

        $('clear').addEventListener('click', () => {
            decodeRun++;
            fileName = '';
            $('in').value = '';
            resetDecode();
            $('in').focus();
        });

        $('wrap').addEventListener('click', () => {
            const on = $('out').classList.toggle('wrap');
            $('wrap').setAttribute('aria-pressed', String(on));
        });

        // Drop a file anywhere on the Decode side.
        const decodeSide = $('decode');
        const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
        decodeSide.addEventListener('dragover', e => {
            if (!hasFiles(e)) return;
            e.preventDefault();
            $('in').classList.add('dragover');
        });
        decodeSide.addEventListener('dragleave', e => {
            if (!decodeSide.contains(e.relatedTarget)) $('in').classList.remove('dragover');
        });
        decodeSide.addEventListener('drop', e => {
            $('in').classList.remove('dragover');
            if (!hasFiles(e)) return;
            e.preventDefault();
            openFile(e.dataTransfer.files[0]);
        });

        // ---------- Encode ----------

        let packed = '';
        let encodeRun = 0;

        async function encode() {
            const run = ++encodeRun;
            const text = $('plain').value;
            $('clear2').disabled = !text;
            $('msg2').textContent = '';
            if (!text) {
                packed = '';
                $('result2').hidden = true;
                return;
            }
            try {
                const bytes = await pack(text);
                if (run !== encodeRun) return;
                packed = toBase64(bytes);
                const long = packed.length > SHOW_LIMIT;
                $('out2').textContent = long ? packed.slice(0, SHOW_LIMIT) : packed;
                $('note2').textContent = long ? `Showing the first ${sizeText(SHOW_LIMIT)}. Copy or Save to get all of it.` : '';
                $('note2').hidden = !long;
                $('meta2').textContent = `Base64 · ${sizeText(packed.length)} · from ${sizeText(new Blob([text]).size)} of text`;
                $('result2').hidden = false;
            } catch (e) {
                if (run !== encodeRun) return;
                packed = '';
                $('result2').hidden = true;
                $('msg2').textContent = `Couldn’t pack this: ${e.message || e}`;
            }
        }

        let packTimer;
        $('plain').addEventListener('input', () => {
            clearTimeout(packTimer);
            packTimer = setTimeout(encode, 150);
        });

        $('clear2').addEventListener('click', () => {
            $('plain').value = '';
            encode();
            $('plain').focus();
        });

        // ---------- Copy and Save ----------

        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
            } catch {
                // Older browsers, or a page without clipboard access: copy through a hidden box.
                const box = document.createElement('textarea');
                box.value = text;
                box.setAttribute('readonly', '');
                box.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
                document.body.append(box);
                box.select();
                const ok = document.execCommand('copy');
                box.remove();
                if (!ok) { toast('Couldn’t copy. Use Save instead.'); return; }
            }
            toast('Copied');
        }

        function saveBlob(blob, name) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            document.body.append(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 60_000);
        }

        $('copy').addEventListener('click', () => { if (shown?.text !== undefined) copyText(shown.text); });
        $('save').addEventListener('click', () => { if (shown) saveBlob(shown.blob, shown.name); });
        $('copy2').addEventListener('click', () => { if (packed) copyText(packed); });
        $('save2').addEventListener('click', () => {
            if (packed) saveBlob(new Blob([packed], { type: 'text/plain' }), 'packed-base64.txt');
        });

        // ---------- tabs ----------

        const tabs = [$('tab-decode'), $('tab-encode')];

        function pick(tab) {
            for (const t of tabs) {
                const on = t === tab;
                t.setAttribute('aria-selected', String(on));
                t.tabIndex = on ? 0 : -1;
                $(t.getAttribute('aria-controls')).hidden = !on;
            }
            history.replaceState(null, '', tab.id === 'tab-encode' ? '#encode' : location.pathname + location.search);
        }

        for (const t of tabs) {
            t.addEventListener('click', () => pick(t));
            t.addEventListener('keydown', e => {
                if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
                const next = tabs[(tabs.indexOf(t) + 1) % tabs.length];
                pick(next);
                next.focus();
            });
        }

        // A link to #encode opens the Encode side, also when the page is already open.
        const fromAddress = () => pick(location.hash === '#encode' ? $('tab-encode') : $('tab-decode'));
        window.addEventListener('hashchange', fromAddress);
        if (location.hash === '#encode') fromAddress();
    </script>
</body>
</html>
