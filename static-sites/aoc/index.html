<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="app-name" content="Advent of Code">
    <meta name="app-section" content="Fun">
    <title>Advent of Code</title>
    <meta name="description" content="My Advent of Code 2024 solutions, drawn. Play, pause and step through each puzzle.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-raised: #1c1c1c;
            --floor: #0e0e0e;
            --tile: #1a1a1a;
            --tile-off: #121212;
            --text-primary: #e5e5e5;
            --text-secondary: #a3a3a3;
            --text-muted: #737373;
            --accent: #10b981;
            --accent-hover: #34d399;
            --accent-soft: rgba(16, 185, 129, 0.15);
            --robot: #10b981;
            --robot-off: rgba(16, 185, 129, 0.32);
            --gold: #fbbf24;
            --gold-faint: rgba(251, 191, 36, 0.16);
            --wall: #4a4a4a;
            --trail: rgba(16, 185, 129, 0.3);
            --trail-faint: rgba(16, 185, 129, 0.12);
            --bar: #2f3b36;
            --box: #9a948c;
            --border: #262626;
            --border-strong: #3a3a3a;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            --border-radius: 8px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            overflow-x: clip;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 15px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-hover); }

        [hidden] { display: none !important; }

        .site-nav {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            max-width: 900px;
            margin: 0 auto;
        }

        .nav-brand { font-weight: 600; color: var(--text-primary); font-size: 1.125rem; }
        .nav-brand:hover { color: var(--accent); }

        .container { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 3rem; }

        .page-head h1 { font-size: 1.125rem; font-weight: 600; margin: 0 0 0.25rem; }
        .subtitle { color: var(--text-secondary); margin: 0 0 1.25rem; }

        button {
            font: inherit;
            font-size: 0.875rem;
            color: var(--text-primary);
            background: var(--bg-raised);
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            padding: 0.45rem 0.75rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover { border-color: var(--text-muted); }
        button:focus-visible, input:focus-visible, canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* ---------- days and parts ---------- */

        .days { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }

        .days button {
            border-radius: 999px;
            padding: 0.3rem 0.8rem;
            color: var(--text-secondary);
            background: var(--bg-secondary);
            border-color: var(--border);
            font-variant-numeric: tabular-nums;
        }

        .days button[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }

        .day-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 0.25rem 1rem; }
        .day-head h2 { font-size: 1rem; font-weight: 600; margin: 0; text-wrap: balance; }
        .links { display: flex; gap: 1rem; font-size: 0.875rem; }

        .parts {
            display: inline-flex;
            padding: 3px;
            margin: 1rem 0 0.75rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
        }

        .parts button { background: none; border: none; padding: 0.4rem 0.95rem; color: var(--text-secondary); }
        .parts button[aria-selected="true"] { background: var(--bg-raised); color: var(--text-primary); font-weight: 500; }

        .part-line { color: var(--text-secondary); margin: 0 0 1rem; max-width: 62ch; }

        /* ---------- the stage ---------- */

        .stage {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.75rem 1rem 1rem;
        }

        .stage-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.25rem 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            font-variant-numeric: tabular-nums;
        }

        .grid-wrap { display: flex; justify-content: center; }
        canvas { display: block; }

        .readout {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.25rem 1rem;
            margin-top: 0.85rem;
            font-family: var(--mono);
            font-size: 0.9rem;
            font-variant-numeric: tabular-nums;
        }

        .readout .clock { color: var(--text-secondary); }
        .readout .answer { color: var(--text-secondary); }
        .readout .answer.hit { color: var(--accent); font-weight: 600; }

        /* ---------- controls ---------- */

        .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin-top: 1rem; }
        .btns { display: flex; gap: 0.375rem; }

        .icon-btn { width: 40px; height: 40px; padding: 0; }
        .icon-btn svg { width: 18px; height: 18px; fill: currentColor; }
        .icon-btn.play { background: var(--accent); border-color: var(--accent); color: var(--bg-primary); }
        .icon-btn.play:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

        .speeds {
            display: inline-flex;
            padding: 3px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
        }

        .speeds button { background: none; border: none; padding: 0.35rem 0.7rem; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
        .speeds button[aria-pressed="true"] { background: var(--bg-raised); color: var(--text-primary); font-weight: 500; }

        .inputs {
            display: inline-flex;
            gap: 2px;
            padding: 2px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        .inputs button { background: none; border: none; border-radius: 4px; padding: 0.15rem 0.6rem; font-size: 0.75rem; color: var(--text-muted); }
        .inputs button[aria-pressed="true"] { background: var(--bg-raised); color: var(--text-primary); }

        .goal { margin-left: auto; height: 40px; color: var(--accent); border-color: var(--accent); background: var(--accent-soft); font-weight: 500; }
        .goal:hover { border-color: var(--accent-hover); color: var(--accent-hover); }

        .scrub { width: 100%; margin: 1rem 0 0; accent-color: var(--accent); }

        /* ---------- chart ---------- */

        .chart { position: relative; margin-top: 1.25rem; }
        .chart-head { display: flex; flex-wrap: wrap; gap: 0 1rem; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.4rem; }
        .chart canvas { width: 100%; cursor: crosshair; touch-action: pan-y; }

        .tip {
            position: absolute;
            top: 1.4rem;
            pointer-events: none;
            padding: 0.2rem 0.5rem;
            font-size: 0.75rem;
            white-space: nowrap;
            color: var(--text-primary);
            background: var(--bg-raised);
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            font-variant-numeric: tabular-nums;
        }

        @media (max-width: 600px) {
            .site-nav { padding: 1rem 24px; }
            .container { padding: 1.5rem 24px 2.5rem; }
            .stage { padding: 0.75rem 0.75rem 0.85rem; }
            .goal { margin-left: 0; width: 100%; }
        }
    </style>
</head>
<body>
    <nav class="site-nav"><a href="/" class="nav-brand">Maheshkumar</a></nav>

    <main class="container">
        <header class="page-head">
            <h1>Advent of Code</h1>
            <p class="subtitle">My 2024 solutions, drawn.</p>
        </header>

        <div class="days" id="days" role="tablist" aria-label="Day"></div>

        <section>
            <div class="day-head">
                <h2 id="dayTitle"></h2>
                <div class="links">
                    <a id="puzzleLink" target="_blank" rel="noopener">Puzzle ↗</a>
                    <a id="codeLink" target="_blank" rel="noopener">My code ↗</a>
                </div>
            </div>

            <div class="parts" id="parts" role="tablist" aria-label="Part"></div>
            <p class="part-line" id="partLine"></p>

            <div class="stage">
                <div class="stage-top">
                    <span id="inputLabel"></span>
                    <div class="inputs" id="inputs" role="group" aria-label="Input" hidden></div>
                    <span id="sizeLabel"></span>
                </div>
                <div class="grid-wrap" id="gridWrap"><canvas id="grid" role="img"></canvas></div>
                <div class="readout">
                    <span class="clock" id="clock"></span>
                    <span class="answer" id="answer"></span>
                </div>
            </div>

            <div class="controls">
                <div class="btns">
                    <button class="icon-btn" id="restart" aria-label="Back to the start" title="Back to the start">
                        <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg>
                    </button>
                    <button class="icon-btn" id="back" aria-label="One second back" title="One second back">
                        <svg viewBox="0 0 24 24"><path d="M15.5 5.5 9 12l6.5 6.5-1.6 1.6L5.8 12l8.1-8.1z"/></svg>
                    </button>
                    <button class="icon-btn play" id="play" aria-label="Play" title="Play">
                        <svg viewBox="0 0 24 24"><path id="playIcon" d="M8 5v14l11-7z"/></svg>
                    </button>
                    <button class="icon-btn" id="fwd" aria-label="One second forward" title="One second forward">
                        <svg viewBox="0 0 24 24"><path d="M8.5 5.5 15 12l-6.5 6.5 1.6 1.6 8.1-8.1-8.1-8.1z"/></svg>
                    </button>
                </div>
                <div class="speeds" id="speeds" role="group" aria-label="Speed"></div>
                <button class="goal" id="goal" hidden></button>
            </div>

            <input class="scrub" id="scrub" type="range" min="0" max="100" step="1" value="0" aria-label="Second">

            <div class="chart" id="chartBox" hidden>
                <div class="chart-head"><span id="chartTitle"></span><span id="chartNote"></span></div>
                <canvas id="chart" aria-hidden="true"></canvas>
                <div class="tip" id="tip" hidden></div>
            </div>
        </section>
    </main>

    <script>
    (() => {
        "use strict";

        const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        const COLORS = {};
        for (const name of ["floor", "tile", "tile-off", "robot", "robot-off", "gold", "gold-faint", "wall", "trail", "trail-faint", "bar", "box", "accent", "text-primary", "text-secondary", "text-muted", "border-strong", "bg-primary"]) {
            COLORS[name] = css("--" + name);
        }

        const mod = (a, m) => ((a % m) + m) % m;
        const num = n => n.toLocaleString("en-US");
        const parseRobots = text => text.trim().split("\n").map(line => line.match(/-?\d+/g).map(Number));

        /* ---------- the grid drawer, shared by every grid day ---------- */

        const grid = {
            canvas: document.getElementById("grid"),
            cols: 1, rows: 1, cell: 1,

            // How much room the grid has across.
            width() {
                return document.getElementById("gridWrap").clientWidth;
            },

            size(cols, rows, maxCell, maxHeight) {
                const width = this.width();
                const cell = Math.max(2, Math.min(maxCell, Math.floor(width / cols), Math.floor(maxHeight / rows)));
                const dpr = window.devicePixelRatio || 1;
                Object.assign(this, { cols, rows, cell });
                this.canvas.style.width = cols * cell + "px";
                this.canvas.style.height = rows * cell + "px";
                this.canvas.width = Math.round(cols * cell * dpr);
                this.canvas.height = Math.round(rows * cell * dpr);
                this.ctx = this.canvas.getContext("2d");
                this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            },

            clear(color) {
                this.ctx.fillStyle = color;
                this.ctx.fillRect(0, 0, this.cols * this.cell, this.rows * this.cell);
            },

            // A square in cell (x, y), shrunk by `inset` px on each side. x and y may be fractions.
            square(x, y, color, inset = 0, radius = 0) {
                const c = this.cell, ctx = this.ctx;
                ctx.fillStyle = color;
                if (radius > 0 && ctx.roundRect) {
                    ctx.beginPath();
                    ctx.roundRect(x * c + inset, y * c + inset, c - 2 * inset, c - 2 * inset, radius);
                    ctx.fill();
                } else {
                    ctx.fillRect(x * c + inset, y * c + inset, c - 2 * inset, c - 2 * inset);
                }
            },

            // Like square, but over w × h cells from (x, y): a box two cells wide, say.
            block(x, y, w, h, color, inset = 0, radius = 0) {
                const c = this.cell, ctx = this.ctx;
                ctx.fillStyle = color;
                ctx.beginPath();
                if (radius > 0 && ctx.roundRect) ctx.roundRect(x * c + inset, y * c + inset, w * c - 2 * inset, h * c - 2 * inset, radius);
                else ctx.rect(x * c + inset, y * c + inset, w * c - 2 * inset, h * c - 2 * inset);
                ctx.fill();
            },

            // A ring around cell (x, y), for "this one is next".
            outline(x, y, color, inset = 0, radius = 0, width = 2, dash = null) {
                const c = this.cell, ctx = this.ctx;
                ctx.strokeStyle = color;
                ctx.lineWidth = width;
                ctx.setLineDash(dash || []);
                ctx.beginPath();
                const o = inset + width / 2;
                if (radius > 0 && ctx.roundRect) ctx.roundRect(x * c + o, y * c + o, c - 2 * o, c - 2 * o, radius);
                else ctx.rect(x * c + o, y * c + o, c - 2 * o, c - 2 * o);
                ctx.stroke();
                ctx.setLineDash([]);
            },

            // A line through cell centres; points are [x, y] in cells and may be fractions.
            line(points, color, width) {
                if (points.length < 2) return;
                const c = this.cell, ctx = this.ctx;
                ctx.strokeStyle = color;
                ctx.lineWidth = width;
                ctx.lineJoin = "round";
                ctx.lineCap = "round";
                ctx.beginPath();
                points.forEach(([x, y], i) => (i ? ctx.lineTo(x * c + c / 2, y * c + c / 2) : ctx.moveTo(x * c + c / 2, y * c + c / 2)));
                ctx.stroke();
            },

            // An arrow head in cell (x, y), pointing at `angle` (radians, 0 = right).
            // Never smaller than `min` px (18 unless asked), so it stays easy to see on small cells.
            // `scale` shrinks it, for one that matters less.
            arrow(x, y, angle, color, min = 18, scale = 1) {
                const c = this.cell, s = Math.max(c, min) * scale, ctx = this.ctx;
                ctx.save();
                ctx.translate(x * c + c / 2, y * c + c / 2);
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.moveTo(s * 0.4, 0);
                ctx.lineTo(-s * 0.3, s * 0.32);
                ctx.lineTo(-s * 0.14, 0);
                ctx.lineTo(-s * 0.3, -s * 0.32);
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();
                ctx.lineWidth = Math.max(1, s * 0.05);
                ctx.strokeStyle = COLORS["bg-primary"];
                ctx.stroke();
                ctx.restore();
            },

            // A round dot in cell (x, y); r is a share of the cell.
            dot(x, y, color, r) {
                const c = this.cell, ctx = this.ctx;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(x * c + c / 2, y * c + c / 2, Math.max(1.5, r * c), 0, Math.PI * 2);
                ctx.fill();
            },

            text(x, y, label, color, scale = 0.38) {
                const c = this.cell, ctx = this.ctx;
                ctx.fillStyle = color;
                ctx.font = `600 ${Math.round(c * scale)}px Inter, system-ui, sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(label, x * c + c / 2, y * c + c / 2 + 1);
            },

            // A round node at (x, y), r px from the middle to the edge, with an optional ring: a computer on Day 23.
            node(x, y, r, fill, ring = null, width = 1, dash = null) {
                const c = this.cell, ctx = this.ctx;
                ctx.beginPath();
                ctx.arc(x * c + c / 2, y * c + c / 2, r, 0, Math.PI * 2);
                if (fill) { ctx.fillStyle = fill; ctx.fill(); }
                if (ring) {
                    ctx.strokeStyle = ring;
                    ctx.lineWidth = width;
                    ctx.setLineDash(dash || []);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            },

            // A filled shape through cell centres, such as a triangle between three nodes.
            shape(points, color) {
                const c = this.cell, ctx = this.ctx;
                ctx.fillStyle = color;
                ctx.beginPath();
                points.forEach(([x, y], i) => (i ? ctx.lineTo(x * c + c / 2, y * c + c / 2) : ctx.moveTo(x * c + c / 2, y * c + c / 2)));
                ctx.closePath();
                ctx.fill();
            },

            // A line from one cell centre to another, bent towards `via` (a quadratic curve): a wire around a gate.
            curve(from, via, to, color, width) {
                const c = this.cell, ctx = this.ctx, p = ([x, y]) => [x * c + c / 2, y * c + c / 2];
                ctx.strokeStyle = color;
                ctx.lineWidth = width;
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(...p(from));
                ctx.quadraticCurveTo(...p(via), ...p(to));
                ctx.stroke();
            },

            // A rounded box w × h px around (x, y), with an optional ring: a gate or a wire on Day 24.
            pill(x, y, w, h, fill, ring = null, width = 1, dash = null, radius = Math.min(h / 2, 6)) {
                const c = this.cell, ctx = this.ctx, cx = x * c + c / 2, cy = y * c + c / 2;
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(cx - w / 2, cy - h / 2, w, h, radius);
                else ctx.rect(cx - w / 2, cy - h / 2, w, h);
                if (fill) { ctx.fillStyle = fill; ctx.fill(); }
                if (ring) {
                    ctx.strokeStyle = ring;
                    ctx.lineWidth = width;
                    ctx.setLineDash(dash || []);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            },
        };

        /* ---------- Day 6: Guard Gallivant ---------- */

        const EXAMPLE_6 = `
....#.....
.........#
..........
..#.......
.......#..
..........
.#..^.....
........#.
#.........
......#...`;

        // Made-up, not my real input: a random map with a long walk.
        const MADE_UP_6 = `
................................
.......#.......#...#...........#
..........#.....................
.................#..............
.....................#..#.......
...............................#
........##..............#.......
............................#...
...................#............
............#.....#.............
.......................#........
..........#.....................
................................
..............................#.
.#.........#..#.................
#........#.#............#.#.#...
.#...........................#..
......#........#....##..........
..#.............#........#..#...
...#...#........^......#........
.......#............#...........
....#....#...............##.....
...##.....................#.....
........#.......#...............
...#.............#......#.......
..#...........................#.
..#...............#.............
....#..............#............
.##..........................#..
.#....#...............##........
................#...............
................................`;

        const STEP = [[-1, 0], [0, 1], [1, 0], [0, -1]];   // up, right, down, left as [row, col]

        function parseMap(text) {
            const lines = text.trim().split("\n");
            const rows = lines.length, cols = lines[0].length;
            const wall = new Uint8Array(rows * cols);
            let start = [0, 0], walls = 0;
            lines.forEach((line, r) => [...line].forEach((ch, c) => {
                if (ch === "#") { wall[r * cols + c] = 1; walls++; }
                if (ch === "^") start = [r, c];
            }));
            return { rows, cols, wall, start, walls };
        }

        // Walk like my code: straight on, turn right at an obstacle, stop on walking off the map,
        // or when the same obstacle is hit from the same side twice (a loop).
        // `extra` is one more obstacle (a cell index), for part 2.
        function guardWalk(map, extra = -1) {
            const { rows, cols, wall } = map;
            let [r, c] = map.start, d = 0;
            const states = [[r, c, d]];          // every move and every turn
            const bumps = new Map();             // obstacle + side -> when it was first hit
            for (;;) {
                const nr = r + STEP[d][0], nc = c + STEP[d][1];
                if (nr < 0 || nc < 0 || nr >= rows || nc >= cols) {
                    states.push([nr, nc, d]);
                    return { states, loop: false, cycleStart: -1 };
                }
                const i = nr * cols + nc;
                if (wall[i] || i === extra) {
                    const key = i * 4 + d;
                    if (bumps.has(key)) return { states, loop: true, cycleStart: bumps.get(key) };
                    bumps.set(key, states.length - 1);
                    d = (d + 1) % 4;
                    states.push([r, c, d]);
                    continue;
                }
                r = nr; c = nc;
                states.push([r, c, d]);
            }
        }

        // Points for drawing a walk: one per move (turns don't move), as [x, y], plus which point each state is at.
        function walkPoints(states) {
            const points = [], pointOf = [];
            for (const [r, c] of states) {
                const last = points[points.length - 1];
                if (!last || last[0] !== c || last[1] !== r) points.push([c, r]);
                pointOf.push(points.length - 1);
            }
            return { points, pointOf };
        }

        // The first `upto` segments of a line (upto may be a fraction), and where its end is.
        function partOf(points, upto) {
            const whole = Math.floor(upto), f = upto - whole;
            const out = points.slice(0, whole + 1);
            if (f > 0 && whole + 1 < points.length) {
                const [ax, ay] = points[whole], [bx, by] = points[whole + 1];
                out.push([ax + (bx - ax) * f, ay + (by - ay) * f]);
            }
            return out;
        }

        function drawFloor(map, tint) {
            const c = grid.cell, inset = c >= 8 ? Math.max(0.5, c * 0.05) : 0, radius = Math.max(1, c * 0.12);
            grid.clear(COLORS.floor);
            for (let r = 0; r < map.rows; r++) {
                for (let col = 0; col < map.cols; col++) {
                    const i = r * map.cols + col;
                    grid.square(col, r, map.wall[i] ? COLORS.wall : tint(i) || COLORS.tile, inset, radius);
                }
            }
            return { inset, radius };
        }

        const lineWidth = () => Math.max(1.5, grid.cell * 0.09);
        const smooth = p => p * p * (3 - 2 * p);

        function day6Part1(text, { speeds, speed, big }) {
            const map = parseMap(text);
            const { states } = guardWalk(map);
            const last = states.length - 1;      // the last step walks off the map
            const firstSeen = new Int32Array(map.rows * map.cols).fill(-1);
            const visitedBy = [];                 // cells visited after each step
            let count = 0;
            states.forEach(([r, c], k) => {
                if (r >= 0 && c >= 0 && r < map.rows && c < map.cols && firstSeen[r * map.cols + c] < 0) {
                    firstSeen[r * map.cols + c] = k;
                    count++;
                }
                visitedBy.push(count);
            });

            const clock = k => (k === 0 ? "Start" : `Step ${num(k)} of ${num(last)}`);

            return {
                line: "The guard walks straight ahead and turns right at every obstacle, until walking off the map. Count the cells the guard steps on.",
                sizeLabel: `${map.cols} × ${map.rows} · ${map.walls} obstacles`,
                max: last, speeds, speed, smooth: true,
                start: 0,
                layout: () => grid.size(map.cols, map.rows, big ? 17 : 44, big ? 560 : 480),

                draw(t) {
                    const k = Math.floor(t), frac = t - k;
                    drawFloor(map, i => (firstSeen[i] >= 0 && firstSeen[i] <= k ? COLORS.trail : null));

                    const points = walkPoints(states.slice(0, k + 1)).points;
                    let head = null;
                    if (k < last) {
                        const [ar, ac, ad] = states[k], [br, bc] = states[k + 1];
                        const p = smooth(frac);
                        if (ar !== br || ac !== bc) {
                            head = { x: ac + (bc - ac) * p, y: ar + (br - ar) * p, angle: (ad * 90 - 90) * Math.PI / 180 };
                            if (frac > 0) points.push([head.x, head.y]);
                        } else {
                            head = { x: ac, y: ar, angle: ((ad + p) * 90 - 90) * Math.PI / 180 };   // turning right
                        }
                    }
                    grid.line(points, COLORS.accent, lineWidth());
                    if (head) grid.arrow(head.x, head.y, head.angle, COLORS["text-primary"]);
                },

                clock: t => clock(Math.floor(t)),

                readout(t) {
                    const k = Math.floor(t);
                    return { text: `Visited ${num(visitedBy[k])}`, hit: k === last };
                },

                describe(t) {
                    const k = Math.floor(t);
                    return `${clock(k)}. ${visitedBy[k]} cells visited.`;
                },
            };
        }

        function day6Part2(text, { speeds, speed, big }) {
            const map = parseMap(text);
            const { states } = guardWalk(map);
            const startIndex = map.start[0] * map.cols + map.start[1];

            // My code tries a new obstacle on every cell the guard walked on, except where it starts.
            const tries = [];
            const tried = new Set([startIndex]);
            for (const [r, c] of states) {
                if (r < 0 || c < 0 || r >= map.rows || c >= map.cols) continue;
                const i = r * map.cols + c;
                if (tried.has(i)) continue;
                tried.add(i);
                const walk = guardWalk(map, i);
                const { points, pointOf } = walkPoints(walk.states);
                tries.push({ i, x: c, y: r, loop: walk.loop, points, cycleAt: walk.loop ? pointOf[walk.cycleStart] : points.length });
            }
            const last = tries.length;
            const loopsBy = [0];
            for (const t of tries) loopsBy.push(loopsBy[loopsBy.length - 1] + (t.loop ? 1 : 0));
            const tryOf = new Map(tries.map((t, j) => [t.i, j]));

            const clock = k => {
                if (k === 0) return "Start";
                return `Try ${num(k)} of ${num(last)} · ${tries[k - 1].loop ? "loop" : "walks off"}`;
            };

            return {
                line: "Add one new obstacle on the guard's path. How many spots trap the guard in a loop? A loop is the same obstacle hit from the same side twice.",
                sizeLabel: `${map.cols} × ${map.rows} · ${map.walls} obstacles`,
                max: last, speeds, speed, smooth: true,
                start: 0,
                layout: () => grid.size(map.cols, map.rows, big ? 17 : 44, big ? 560 : 480),

                draw(t) {
                    const k = Math.floor(t), frac = t - k;
                    const running = frac > 0 && k < last;
                    const cur = running ? k : k - 1;          // the try on screen
                    const progress = running ? frac : 1;

                    // Faint green: cells still to try. Gold dots: spots already found to make a loop.
                    const { inset, radius } = drawFloor(map, i => {
                        const j = tryOf.get(i);
                        return j !== undefined && j > cur ? COLORS["trail-faint"] : null;
                    });
                    for (let j = 0; j < Math.min(cur, last); j++) if (tries[j].loop) grid.dot(tries[j].x, tries[j].y, COLORS.gold, 0.22);
                    if (cur < 0) {
                        grid.arrow(map.start[1], map.start[0], -Math.PI / 2, COLORS["text-primary"]);
                        return;
                    }

                    const now = tries[cur];
                    grid.square(now.x, now.y, COLORS.gold, inset, radius);
                    const segments = now.points.length - 1;
                    const upto = segments * smooth(progress);
                    const drawn = partOf(now.points, upto);
                    // Grey on the way in, gold once the guard is going round the loop.
                    grid.line(drawn.slice(0, now.cycleAt + 1), COLORS["text-muted"], lineWidth());
                    if (drawn.length > now.cycleAt + 1) grid.line(drawn.slice(now.cycleAt), COLORS.gold, lineWidth());
                    if (progress < 1 && segments > 0) {
                        // the guard, at the front of the line
                        const end = drawn[drawn.length - 1], j = Math.min(Math.floor(upto), segments - 1);
                        const [ax, ay] = now.points[j], [bx, by] = now.points[j + 1];
                        grid.arrow(end[0], end[1], Math.atan2(by - ay, bx - ax), COLORS["text-primary"]);
                    }
                },

                clock: t => clock(Math.floor(t)),

                readout(t) {
                    const k = Math.floor(t);
                    return { text: `Loops ${num(loopsBy[k])}`, hit: k === last };
                },

                describe(t) {
                    const k = Math.floor(t);
                    return `${clock(k)}. ${loopsBy[k]} loop spots found.`;
                },
            };
        }

        /* ---------- Day 9: Disk Fragmenter ---------- */

        const EXAMPLE_9 = "2333133121414131402";

        // Made-up, not my real input: 100 files with random sizes and gaps.
        const MADE_UP_9 = "8662311394239613347132113523224271527260407074304326114260219091854323413110553211723690652326644346136071428261522510757462234175656151501151263010827213518551255123819332832055312140418495713586552";

        // The disk map alternates file sizes and gap sizes. Each block holds its file number, or -1 for free.
        function parseDisk(map) {
            const disk = [];
            for (let i = 0; i < map.length; i++) {
                const id = i % 2 === 0 ? i / 2 : -1;
                for (let n = Number(map[i]); n > 0; n--) disk.push(id);
            }
            return disk;
        }

        // Part 1, like my solution: the first free block from the left takes the last file block from the right.
        function blockMoves(disk) {
            const d = disk.slice(), moves = [];
            let left = 0, right = d.length - 1;
            for (;;) {
                while (left < d.length && d[left] !== -1) left++;
                while (right >= 0 && d[right] === -1) right--;
                if (left >= right) break;
                moves.push({ id: d[right], from: right, to: left, n: 1 });
                d[left] = d[right];
                d[right] = -1;
            }
            return moves;
        }

        // Part 2: whole files, highest number first. Each one tries once to jump into the first gap on its left that fits.
        function fileMoves(disk) {
            const d = disk.slice(), files = [];
            d.forEach((id, i) => {
                if (id < 0) return;
                files[id] ??= { start: i, n: 0 };
                files[id].n++;
            });
            const moves = [];
            for (let id = files.length - 1; id >= 0; id--) {
                if (!files[id]) continue;
                const { start, n } = files[id];
                let to = -1;
                for (let i = 0, run = 0; i < start; i++) {
                    run = d[i] === -1 ? run + 1 : 0;
                    if (run === n) { to = i - n + 1; break; }
                }
                if (to >= 0) for (let k = 0; k < n; k++) { d[to + k] = id; d[start + k] = -1; }
                moves.push({ id, from: start, to, n });
            }
            return moves;
        }

        function day9(map, part, { speeds, speed, labels }) {
            const disk = parseDisk(map);
            const moves = part === 1 ? blockMoves(disk) : fileMoves(disk);
            const total = disk.length, last = moves.length;
            const maxId = Math.max(...disk);
            // Low file numbers are cool green, high ones warm gold, so blocks from the end stand out at the front.
            const colors = Array.from({ length: maxId + 1 }, (_, id) => {
                const p = maxId ? id / maxId : 0;
                return `hsl(${160 - 115 * p} ${64 + 32 * p}% ${50 + 6 * p}%)`;
            });
            let cols = 1;

            const diskAt = k => {
                const d = disk.slice();
                for (let i = 0; i < k; i++) {
                    const m = moves[i];
                    if (m.to < 0) continue;
                    for (let j = 0; j < m.n; j++) { d[m.to + j] = m.id; d[m.from + j] = -1; }
                }
                return d;
            };
            const checksum = d => d.reduce((sum, id, i) => (id < 0 ? sum : sum + id * i), 0);
            const at = i => [i % cols, Math.floor(i / cols)];
            const smoothStep = p => p * p * (3 - 2 * p);

            const clock = k => {
                if (k === 0) return "Start";
                if (part === 1) return `Move ${num(k)} of ${num(last)}`;
                const m = moves[k - 1];
                return `File ${m.id} ${m.to >= 0 ? "moved" : "stays"} · ${k} of ${last}`;
            };

            return {
                line: part === 1
                    ? "The disk map takes turns: a file's size, then a gap's size. Move blocks one at a time from the end into the first gap, then add up position × file number."
                    : "Now move whole files. From the highest number down, each file tries once to jump into the first gap on its left that fits it.",
                sizeLabel: `${total} blocks · ${maxId + 1} files`,
                max: last, speeds, speed, smooth: true,
                start: 0,

                layout() {
                    const w = grid.width();
                    cols = labels ? (w / 21 >= 30 ? 21 : 14) : (w >= 600 ? 47 : 30);
                    grid.size(cols, Math.ceil(total / cols), labels ? 40 : 16, 600);
                },

                draw(t) {
                    const k = Math.floor(t), frac = t - k, c = grid.cell;
                    const d = diskAt(k);
                    const m = k < last ? moves[k] : null;
                    const flying = m && frac > 0 && m.to >= 0;
                    if (flying) for (let j = 0; j < m.n; j++) d[m.from + j] = -1;

                    const inset = Math.max(1, Math.round(c * 0.06)), radius = Math.max(1.5, c * 0.14);
                    grid.clear(COLORS.floor);
                    for (let i = 0; i < total; i++) {
                        const [x, y] = at(i);
                        grid.square(x, y, d[i] < 0 ? COLORS.tile : colors[d[i]], inset, radius);
                        if (labels && d[i] >= 0) grid.text(x, y, String(d[i]), COLORS["bg-primary"], 0.46);
                    }

                    if (!m) return;
                    if (flying) {
                        // The block (or whole file) flies to its new place, lifted a little on the way.
                        const p = smoothStep(frac), lift = Math.sin(Math.PI * p) * 0.45;
                        for (let j = 0; j < m.n; j++) {
                            const [fx, fy] = at(m.from + j), [tx, ty] = at(m.to + j);
                            const x = fx + (tx - fx) * p, y = fy + (ty - fy) * p - lift;
                            grid.square(x, y, colors[m.id], inset, radius);
                            grid.outline(x, y, COLORS["text-primary"], inset, radius, Math.max(1, c * 0.06));
                            if (labels) grid.text(x, y, String(m.id), COLORS["bg-primary"], 0.46);
                        }
                    } else if (frac === 0) {
                        // Paused: ring what moves next, and where it goes.
                        for (let j = 0; j < m.n; j++) {
                            const [x, y] = at(m.from + j);
                            grid.outline(x, y, COLORS["text-primary"], inset, radius, Math.max(1, c * 0.06));
                            if (m.to >= 0) {
                                const [tx, ty] = at(m.to + j);
                                grid.outline(tx, ty, COLORS["text-muted"], inset, radius, Math.max(1, c * 0.06), [3, 3]);
                            }
                        }
                    }
                },

                clock: t => clock(Math.floor(t)),

                readout(t) {
                    const k = Math.floor(t);
                    return { text: `Checksum ${num(checksum(diskAt(k)))}`, hit: k === last };
                },

                describe(t) {
                    const k = Math.floor(t);
                    return `${clock(k)}. Checksum ${num(checksum(diskAt(k)))}.`;
                },
            };
        }

        /* ---------- Day 14: Restroom Redoubt ---------- */

        const EXAMPLE_14 = `p=0,4 v=3,-3
p=6,3 v=-1,-3

        // Where every robot is at second t, as whole cells.
        function robotsAt(robots, t, W, H) {
            return robots.map(([px, py, vx, vy]) => [mod(px + vx * t, W), mod(py + vy * t, H)]);

        function day14Part1() {
            const W = 11, H = 7, MX = 5, MY = 3;
            const robots = parseRobots(EXAMPLE_14);

            const quadrants = t => {
                const q = [0, 0, 0, 0];
                for (const [x, y] of robotsAt(robots, t, W, H)) {
                    if (x !== MX && y !== MY) q[(x > MX ? 1 : 0) + (y > MY ? 2 : 0)]++;
                }
                return q;
            };

            return {
                line: "Robots walk in straight lines and wrap around the edges. After 100 seconds, count the robots in each quarter and multiply.",
                sizeLabel: `${W} × ${H} · ${robots.length} robots`,
                max: 100, speeds: [1, 5, 20], speed: 5, smooth: true,
                start: 0,
                layout: () => grid.size(W, H, 56, 420),

                draw(t) {
                    const c = grid.cell, gap = Math.max(1, Math.round(c * 0.06));
                    grid.clear(COLORS.floor);
                    for (let y = 0; y < H; y++) {
                        for (let x = 0; x < W; x++) {
                            grid.square(x, y, x === MX || y === MY ? COLORS["tile-off"] : COLORS.tile, gap, Math.max(2, c * 0.12));
                        }
                    }

                    const whole = Number.isInteger(t);
                    const counts = new Map();
                    const inset = c * 0.16, radius = c * 0.22;
                    for (const [px, py, vx, vy] of robots) {
                        const x = mod(px + vx * t, W), y = mod(py + vy * t, H);
                        const cx = Math.round(x) % W, cy = Math.round(y) % H;
                        const color = cx === MX || cy === MY ? COLORS["robot-off"] : COLORS.robot;
                        // Draw a second copy past the edge, so a robot slides out one side and in the other.
                        for (const dx of x > W - 1 ? [0, -W] : [0]) {
                            for (const dy of y > H - 1 ? [0, -H] : [0]) {
                                grid.square(x + dx, y + dy, color, inset, radius);
                            }
                        }
                        if (whole) counts.set(cx + "," + cy, (counts.get(cx + "," + cy) || 0) + 1);
                    }
                    for (const [key, n] of counts) {
                        if (n < 2) continue;
                        const [x, y] = key.split(",").map(Number);
                        grid.text(x, y, String(n), COLORS["bg-primary"]);
                    }
                },

                readout(t) {
                    const q = quadrants(Math.floor(t));
                    return { text: `${q.join(" × ")} = ${q.reduce((a, b) => a * b, 1)}`, hit: Math.floor(t) === 100 };
                },

                describe(t) {
                    const q = quadrants(Math.floor(t));
                    return `Second ${Math.floor(t)}: quarters hold ${q.join(", ")} robots.`;
                },
            };
        }

        function day14Part2() {
            const W = 101, H = 103, RULE = 7;
            const robots = parseRobots(document.getElementById("day14-made-up").textContent);
            const seconds = W * H;      // after this many seconds every robot is back where it started

            // For every second: the longest row of robots side by side, and where it starts.
            // My solution stops at the first second with 7 in a row.
            const longest = new Uint8Array(seconds);
            const runAt = new Int32Array(seconds);
            const stamp = new Int32Array(W * H);
            const xs = new Int32Array(robots.length), ys = new Int32Array(robots.length);
            let first = -1;
            for (let t = 0; t < seconds; t++) {
                for (let i = 0; i < robots.length; i++) {
                    const [px, py, vx, vy] = robots[i];
                    xs[i] = mod(px + vx * t, W);
                    ys[i] = mod(py + vy * t, H);
                    stamp[ys[i] * W + xs[i]] = t + 1;
                }
                let best = 0, at = 0;
                for (let i = 0; i < robots.length; i++) {
                    const x = xs[i], row = ys[i] * W;
                    if (x > 0 && stamp[row + x - 1] === t + 1) continue;     // not the left end of a row
                    let n = 1;
                    while (x + n < W && stamp[row + x + n] === t + 1) n++;
                    if (n > best) { best = n; at = row + x; }
                }
                longest[t] = best;
                runAt[t] = at;
                if (first < 0 && t > 0 && best >= RULE) first = t;
            }

            return {
                line: "Same robots, a bigger room. Somewhere the robots draw a Christmas tree: find the first second it shows up.",
                sizeLabel: `${W} × ${H} · ${robots.length} robots`,
                max: seconds - 1, speeds: [1, 10, 100], speed: 10, smooth: false,
                start: 0,
                layout: () => grid.size(W, H, 6, 560),
                goal: { label: "Find the tree", target: first },

                draw(t) {
                    const c = grid.cell, inset = c >= 5 ? 0.5 : 0;
                    grid.clear(COLORS.floor);
                    for (const [x, y] of robotsAt(robots, t, W, H)) grid.square(x, y, COLORS.robot, inset);
                    if (longest[t] >= RULE) {
                        const x0 = runAt[t] % W, y0 = Math.floor(runAt[t] / W);
                        for (let n = 0; n < longest[t]; n++) grid.square(x0 + n, y0, COLORS.gold, inset);
                    }
                },

                readout(t) {
                    const n = longest[t];
                    return { text: `${n} in a row`, hit: n >= RULE };
                },

                describe(t) {
                    return t === first ? `Second ${num(t)}: the robots draw a Christmas tree.` : `Second ${num(t)}: robots scattered, longest row ${longest[t]}.`;
                },

                chart: {
                    title: "Longest row, each second",
                    note: `My code stops at the first ${RULE} in a row`,
                    values: longest,
                    rule: RULE,
                    tip: (t, v) => `Second ${num(t)} · ${v} in a row`,
                },
            };
        }

        const MADE_UP_15 = () => document.getElementById("day15-made-up").textContent;

        const PUSH = { "<": [0, -1], ">": [0, 1], "^": [-1, 0], v: [1, 0] };     // [row, col]
        const ARROWS = { "<": "←", ">": "→", "^": "↑", v: "↓" };
        const WORDS = { "<": "left", ">": "right", "^": "up", v: "down" };
        const EMPTY = 0, WALL = 1, BOX = 2, BOX_L = 3, BOX_R = 4;               // BOX_L/BOX_R: the two halves of a wide box

        // The map as cell codes (twice as wide for part 2, the way my code widens it), the robot and the moves.
        function parseWarehouse(text, wide) {
            const [top, bottom] = text.trim().split("\n\n");
            let lines = top.trim().split("\n");
            if (wide) lines = lines.map(line => line.replace(/[#O.@]/g, ch => ({ "#": "##", O: "[]", ".": "..", "@": "@." })[ch]));
            const rows = lines.length, cols = lines[0].length;
            const cells = new Uint8Array(rows * cols);
            let robot = 0, boxes = 0;
            lines.forEach((line, r) => [...line].forEach((ch, c) => {
                const i = r * cols + c;
                if (ch === "#") cells[i] = WALL;
                else if (ch === "O") { cells[i] = BOX; boxes++; }
                else if (ch === "[") { cells[i] = BOX_L; boxes++; }
                else if (ch === "]") cells[i] = BOX_R;
                else if (ch === "@") robot = i;
            }));
            return { rows, cols, cells, robot, boxes, moves: bottom.replace(/[^<>^v]/g, "") };
        }

        // Every move, the way my code does it, with a copy of the map after each one.
        function warehouseRun(map, wide) {
            const { rows, cols, moves } = map, n = rows * cols;
            const cells = map.cells.slice();
            const snaps = new Uint8Array((moves.length + 1) * n);
            const robots = new Int32Array(moves.length + 1);
            const gps = [];
            const steps = [];
            let robot = map.robot;
            const save = k => {
                snaps.set(cells, k * n);
                robots[k] = robot;
                let sum = 0;
                for (let i = 0; i < n; i++) if (cells[i] === BOX || cells[i] === BOX_L) sum += 100 * Math.floor(i / cols) + (i % cols);
                gps.push(sum);
            };
            save(0);

            for (let k = 0; k < moves.length; k++) {
                const dir = moves[k], [dr, dc] = PUSH[dir], d = dr * cols + dc, next = robot + d;
                let step = { dir, kind: "walk", boxes: [], hits: [] };
                if (cells[next] === WALL) step.kind = "wall";
                else if (cells[next] === EMPTY) robot = next;
                else if (!wide) {

                    let at = next;

                    if (cells[at] === WALL) Object.assign(step, { kind: "blocked", hits: [at] });
                    else {
                        cells[at] = BOX;
                        cells[next] = EMPTY;
                        robot = next;
                        step.kind = "push";
                    }
                } else {
                    // Part 2: gather every box the push reaches (a stack of box halves still to look past),
                    // then move them all, but only if none of them would hit a wall.
                    const left = i => (cells[i] === BOX_L ? i : i - 1);
                    const boxes = step.boxes, first = left(next), stack = [first, first + 1];
                    boxes.push(first);
                    while (stack.length) {
                        const at = stack.pop() + d;
                        if (cells[at] !== BOX_L && cells[at] !== BOX_R) continue;
                        const b = left(at);
                        if (!boxes.includes(b)) { boxes.push(b); stack.push(b, b + 1); }
                    }
                    for (const b of boxes) for (const at of [b + d, b + 1 + d]) if (cells[at] === WALL && !step.hits.includes(at)) step.hits.push(at);
                    if (step.hits.length) step.kind = "blocked";

                        for (const b of boxes) { cells[b + d] = BOX_L; cells[b + 1 + d] = BOX_R; }

                        step.kind = "push";
                    }
                }
                steps.push(step);
                save(k + 1);
            }

        // each with a tile, a facing and a score. Each one steps ahead (+1) or turns toward an

        // Each reindeer is one step or turn further on than the one that added it, and the queue
        // is first in, first out, so the search runs in rounds.
        function reindeerSearch(text) {
            const lines = text.trim().split("\n");
            const rows = lines.length, cols = lines[0].length, n = rows * cols;
            const wall = new Uint8Array(n);
            let start = 0, end = 0, open = 0;
            lines.forEach((line, r) => [...line].forEach((ch, c) => {
                const i = r * cols + c;
                if (ch === "#") wall[i] = 1;
                else open++;
                if (ch === "S") start = i;
                if (ch === "E") end = i;
            }));

            // The queue, in the order my code takes it out.
            const at = [start], face = [1], score = [0], parent = [-1], round = [0], dropped = [];
            const best = new Float64Array(n * 4).fill(Infinity);     // lowest score per tile and facing
            const arrivals = [];                                     // reaching E: { from, score, face, round }
            const push = (i, d, s, from) => { at.push(i); face.push(d); score.push(s); parent.push(from); round.push(round[from] + 1); };
            for (let j = 0; j < at.length; j++) {
                const i = at[j], d = face[j], s = score[j];
                if (s > best[i * 4 + d]) { dropped[j] = 1; continue; }
                dropped[j] = 0;
                best[i * 4 + d] = s;
                const r = Math.floor(i / cols), c = i % cols;
                for (const nd of [d, ...SIDEWAYS(d)]) {
                    const nr = r + FACE[nd][0], nc = c + FACE[nd][1], ni = nr * cols + nc;
                    if (nr < 0 || nc < 0 || nr >= rows || nc >= cols || wall[ni]) continue;
                    if (ni === end) arrivals.push({ from: j, score: s + 1, face: nd, round: round[j] + 1 });
                    else if (nd === d) push(ni, nd, s + 1, j);
                    else push(i, nd, s + 1000, j);

            // After each round: how many turns the cheapest reindeer on each tile took (-1: none yet).
            const turns = new Int16Array((last + 1) * n).fill(-1);
            const low = new Float64Array(n).fill(Infinity);
            let maxTurns = 0;
            for (let k = 0, j = 0; k <= last; k++) {
                for (; j < at.length && round[j] === k; j++) if (!dropped[j] && score[j] < low[at[j]]) low[at[j]] = score[j];
                for (let i = 0; i < n; i++) {
                    if (low[i] === Infinity) continue;
                    turns[k * n + i] = Math.floor(low[i] / 1000);
                    maxTurns = Math.max(maxTurns, turns[k * n + i]);

            const pathOf = j => {

                    for (const i of arr.tiles) piles.get(arr.score).add(i);

                }

                first.push(firstSoFar);
                pile.push(firstSoFar ? [...piles.get(lowSoFar)] : []);
            }

            return { rows, cols, n, wall, start, end, open, at, face, parent, dropped, roundStart, arrivals, last, turns, maxTurns, lowest, first, pile };
        }

        // Computers are numbered in the order they first show up, which is the order networkx keeps them in.
        function parseNetwork(text) {
            const names = [], index = new Map(), links = [];
            const id = name => {
                if (!index.has(name)) { index.set(name, names.length); names.push(name); }
                return index.get(name);
            };
            for (const line of text.trim().split("\n")) {
                const [a, b] = line.trim().split("-");
                links.push([id(a), id(b)]);
            }
            const adj = names.map(() => new Set());

            return { names, links, adj, n: names.length };

        // Part 1, the way networkx's enumerate_all_cliques goes: a queue of groups where everyone is linked,
        // each with the computers further down the list that link to all of it (`could`). Taking a group out,
        // it adds the group plus each of those computers to the back, so groups come out smallest first.
        function allGroups(net) {
            const { adj } = net;
            const queue = adj.map((s, u) => ({ group: [u], could: [...s].filter(v => v > u).sort((a, b) => a - b) }));
            for (let j = 0; j < queue.length; j++) {
                const { group, could } = queue[j];
                could.forEach((u, i) => queue.push({ group: [...group, u], could: could.slice(i + 1).filter(v => adj[u].has(v)) }));
            }
            return queue;
        }

        // Part 2, the way networkx's find_cliques goes (Bron–Kerbosch with a pivot): grow a group one computer
        // at a time from the ones linked to all of it, skip the pivot's neighbours, and note a group when
        // nothing more can join. Where networkx takes any computer from a set, this takes the first one.
        function maximalGroups(net) {
            const { adj, n } = net;
            const pivot = (subg, cand) => {
                let best = -1, at = subg[0];
                for (const u of subg) {
                    let k = 0;
                    for (const v of cand) if (adj[u].has(v)) k++;
                    if (k > best) { best = k; at = u; }
                }
                return at;
            };
            let cand = [...Array(n).keys()], subg = cand.slice();
            let u = pivot(subg, cand), ext = cand.filter(v => !adj[u].has(v));
            const stack = [], Q = [null], found = [];
            for (;;) {
                if (ext.length) {
                    const q = ext.shift();
                    cand = cand.filter(v => v !== q);
                    Q[Q.length - 1] = q;
                    const subgQ = subg.filter(v => adj[q].has(v));
                    if (!subgQ.length) found.push(Q.slice());
                    else {
                        const candQ = cand.filter(v => adj[q].has(v));
                        if (candQ.length) {
                            stack.push([subg, cand, ext]);
                            Q.push(null);
                            subg = subgQ;
                            cand = candQ;
                            u = pivot(subg, cand);
                            ext = cand.filter(v => !adj[u].has(v));
                        }
                    }
                } else {
                    Q.pop();
                    if (!stack.length) break;
                    [subg, cand, ext] = stack.pop();
                }
            }
            return found;
        }

        // Where each computer sits, worked out once: computers k links apart try to sit k steps apart
        // (a stress layout), from a few fixed starts, keeping the best. Then each computer is nudged off
        // links that aren't its own and away from computers too close. Gives [x, y] from 0 to 1.
        function networkLayout(net) {
            const { n, adj, links } = net;
            const hops = [...Array(n)].map((_, s) => {
                const d = new Array(n).fill(-1), queue = [s];
                d[s] = 0;
                for (let h = 0; h < queue.length; h++) for (const v of adj[queue[h]]) if (d[v] < 0) { d[v] = d[queue[h]] + 1; queue.push(v); }
                return d;
            });
            const far = Math.max(...hops.flat()) + 1;
            for (const d of hops) d.forEach((v, j) => { if (v < 0) d[j] = far; });

            let seed = 2024;
            const rand = () => {
                seed = (seed + 0x6d2b79f5) | 0;
                let z = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                z = (z + Math.imul(z ^ (z >>> 7), 61 | z)) ^ z;
                return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
            };
            let best = null, bestStress = Infinity;
            for (let start = 0; start < 6; start++) {
                const x = Array.from({ length: n }, () => rand() * far), y = Array.from({ length: n }, () => rand() * far);
                for (let it = 0; it < 200; it++) {
                    for (let i = 0; i < n; i++) {
                        let sx = 0, sy = 0, sw = 0;
                        for (let j = 0; j < n; j++) {
                            if (j === i) continue;
                            const d = hops[i][j], w = 1 / (d * d);
                            const dx = x[i] - x[j], dy = y[i] - y[j], dist = Math.hypot(dx, dy) || 1e-6;
                            sx += w * (x[j] + (d * dx) / dist);
                            sy += w * (y[j] + (d * dy) / dist);
                            sw += w;
                        }
                        x[i] = sx / sw;
                        y[i] = sy / sw;
                    }
                }
                let stress = 0;
                for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) stress += (Math.hypot(x[i] - x[j], y[i] - y[j]) - hops[i][j]) ** 2 / hops[i][j] ** 2;
                if (stress < bestStress) { bestStress = stress; best = { x, y }; }
            }

            const { x, y } = best, CLEAR = 0.32, APART = 0.62;     // in links: room beside a link, room between computers
            for (let it = 0; it < 120; it++) {
                for (let i = 0; i < n; i++) {
                    for (const [a, b] of links) {
                        if (a === i || b === i) continue;
                        const ex = x[b] - x[a], ey = y[b] - y[a];
                        const u = ((x[i] - x[a]) * ex + (y[i] - y[a]) * ey) / (ex * ex + ey * ey || 1e-9);
                        if (u <= 0 || u >= 1) continue;
                        const dx = x[i] - (x[a] + u * ex), dy = y[i] - (y[a] + u * ey), dist = Math.hypot(dx, dy) || 1e-6;
                        if (dist < CLEAR) {
                            // the computer steps off, and the link moves the other way a little
                            const push = (CLEAR - dist) * 0.5, ux = dx / dist, uy = dy / dist;
                            x[i] += ux * push; y[i] += uy * push;
                            x[a] -= ux * push * 0.25; y[a] -= uy * push * 0.25;
                            x[b] -= ux * push * 0.25; y[b] -= uy * push * 0.25;
                        }
                    }
                    for (let j = 0; j < n; j++) {
                        if (j === i) continue;
                        const dx = x[i] - x[j], dy = y[i] - y[j], dist = Math.hypot(dx, dy) || 1e-6;
                        if (dist < APART) {
                            const push = (APART - dist) / 4;
                            x[i] += (dx / dist) * push; y[i] += (dy / dist) * push;
                            x[j] -= (dx / dist) * push; y[j] -= (dy / dist) * push;

            const s = Math.max(maxX - minX, maxY - minY) || 1;
            const ox = (1 - (maxX - minX) / s) / 2, oy = (1 - (maxY - minY) / s) / 2;
            return x.map((_, i) => [(x[i] - minX) / s + ox, (y[i] - minY) / s + oy]);
        }

        function day23(text, part, { speeds, speed, maxSide, nodeShare, minR, maxR }) {

        function parseCircuit(text) {
            const [top, bottom] = text.trim().split(/\n\s*\n/);
            const inputs = top.trim().split("\n").map(line => {
                const [name, value] = line.split(":").map(s => s.trim());
                return { name, value: Number(value) };
            });
            const gates = bottom.trim().split("\n").map(line => {
                const [a, op, b, , out] = line.trim().split(/\s+/);
                return { a, op, b, out };
            });
            return { inputs, gates };
        }

        const gateValue = (op, a, b) => (op === "AND" ? a & b : op === "OR" ? a | b : a ^ b);
        const isXY = w => w[0] === "x" || w[0] === "y";
        const bitNo = w => Number(w.slice(1));

        // Part 1, the way my code goes: down the list of gates, again and again. A gate whose two inputs
        // both have a value works out its own (every pass, even when it has one already); the others wait.
        // It stops after a pass where no gate had to wait. firstAt: the check, counted from the very
        // start, where each gate first got its value.
        function gatePasses({ inputs, gates }) {
            const value = new Map(inputs.map(w => [w.name, w.value]));
            const G = gates.length, firstAt = new Array(G).fill(Infinity), waiting = [];
            for (let p = 0; p <= G; p++) {
                let waits = 0;
                gates.forEach((g, i) => {
                    if (value.has(g.a) && value.has(g.b)) {
                        value.set(g.out, gateValue(g.op, value.get(g.a), value.get(g.b)));
                        if (firstAt[i] === Infinity) firstAt[i] = p * G + i;
                    } else waits++;
                });
                waiting.push(waits);
                if (!waits) break;
            }
            return { value, firstAt, waiting, passes: waiting.length };
        }

        // The value on every wire when gate i writes to outs[i].
        function wireValues({ inputs, gates }, outs) {
            const value = new Map(inputs.map(w => [w.name, w.value]));
            const from = new Map(outs.map((w, i) => [w, i]));
            const get = (w, depth) => {
                if (value.has(w)) return value.get(w);
                const i = from.get(w);
                if (i === undefined || depth > gates.length) return 0;
                const v = gateValue(gates[i].op, get(gates[i].a, depth + 1), get(gates[i].b, depth + 1));
                value.set(w, v);
                return v;
            };
            outs.forEach(w => get(w, 0));
            return value;
        }

        // Where each gate sits in an adder: a band per bit with x and y, then x XOR y and x AND y, the
        // carry OR, the XOR and AND that take the carry in, and the z wire, as [along the bits, across].
        // A gate's bit is the highest x or y bit it hears from; its kind comes from its type and from
        // whether its inputs are x and y, so a swapped output wire doesn't move it.
        function adderSpots({ inputs, gates }) {
            const from = new Map(gates.map((g, i) => [g.out, i]));
            const bit = new Array(gates.length).fill(-1);
            const bitOfWire = w => (isXY(w) ? bitNo(w) : from.has(w) ? bitOfGate(from.get(w)) : 0);
            const bitOfGate = i => {
                if (bit[i] < 0) { bit[i] = 0; bit[i] = Math.max(bitOfWire(gates[i].a), bitOfWire(gates[i].b)); }
                return bit[i];
            };
            const kind = gates.map(g => (g.op === "OR" ? "or" : g.op.toLowerCase() + (isXY(g.a) && isXY(g.b) ? "1" : "2")));
            const SPOT = { xor1: [0, 1], and1: [1, 1], or: [1.4, 2], xor2: [0, 3], and2: [1, 3] };
            const gateSpots = gates.map((_, i) => [2 * bitOfGate(i) + SPOT[kind[i]][0], SPOT[kind[i]][1]]);
            const inputSpots = inputs.map(w => [2 * bitNo(w.name) + (w.name[0] === "y" ? 1 : 0), 0]);
            return { bit, kind, gateSpots, inputSpots, bits: Math.ceil(inputs.length / 2) };
        }

        // A circuit that isn't an adder, in columns: x and y, then each gate one column right of its latest
        // input, then the gates that write a z wire, then the z wires. A few times over, the gates in a column
        // are sorted by where their wires go, so fewer lines cross. Gives [column, share of the height].
        function layerSpots({ inputs, gates }, zs) {
            const I = inputs.length, G = gates.length;
            const from = new Map(gates.map((g, i) => [g.out, i]));
            const depth = new Array(G).fill(-1);
            const wireDepth = w => (from.has(w) ? gateDepth(from.get(w)) : 0);
            const gateDepth = i => {
                if (depth[i] < 0) { depth[i] = 0; depth[i] = 1 + Math.max(wireDepth(gates[i].a), wireDepth(gates[i].b)); }
                return depth[i];
            };
            const writesZ = i => gates[i].out[0] === "z";
            let D = 1;
            gates.forEach((_, i) => { gateDepth(i); if (!writesZ(i)) D = Math.max(D, depth[i]); });

            const cols = Array.from({ length: D + 3 }, () => []);
            cols[0] = inputs.map((_, i) => i).sort((p, q) => bitNo(inputs[p].name) - bitNo(inputs[q].name) || (inputs[p].name < inputs[q].name ? -1 : 1));
            gates.forEach((_, i) => { if (!writesZ(i)) cols[depth[i]].push(I + i); });
            cols[D + 1] = zs.map(z => I + from.get(z));
            cols[D + 2] = zs.map((_, k) => I + G + k);

            const inputAt = new Map(inputs.map((w, i) => [w.name, i]));
            const near = Array.from({ length: I + G + zs.length }, () => []);
            gates.forEach((g, i) => {
                for (const w of [g.a, g.b]) {
                    const u = inputAt.has(w) ? inputAt.get(w) : from.has(w) ? I + from.get(w) : -1;
                    if (u >= 0) { near[u].push(I + i); near[I + i].push(u); }
                }
            });
            const spot = [];
            const place = () => cols.forEach((col, c) => col.forEach((u, j) => { spot[u] = [c, (j + 0.5) / col.length]; }));
            const mean = u => near[u].reduce((s, v) => s + spot[v][1], 0) / (near[u].length || 1);
            place();
            for (let round = 0; round < 6; round++) {
                for (let c = 1; c <= D; c++) {
                    const at = new Map(cols[c].map(u => [u, mean(u)]));
                    cols[c].sort((p, q) => at.get(p) - at.get(q));
                    place();
                }
            }
            return { spot, columns: cols.length, rows: Math.max(...cols.map(col => col.length)) };
        }

        function day24(text, part, { speeds, speed, adder }) {
            const circuit = parseCircuit(text);

            const layout = () => {

                let W, H, spotOf;

                        const along = (W - 2 * PAD) / (2 * n + 1), across = 62;
                        pw = Math.min(46, along * 0.84);

                        H = 2 * PAD + 6 + ph + 4 * across;
                    } else {
                        W = Math.floor(Math.min(room, 460) / 4) * 4;
                        const along = 24;
                        pw = Math.min(46, ((W - 2 * PAD) / 5) * 0.8);
                        ph = 17;
                        const across = (W - 2 * PAD - 6 - pw) / 4;
                        spotOf = ([a, c]) => [PAD + 3 + pw / 2 + c * across, PAD + 3 + ph / 2 + a * along];
                        H = 2 * PAD + 6 + ph + 2 * n * along;
                    }
                } else {
                    W = Math.floor(Math.min(room, 600) / 4) * 4;
                    const C = shape.columns, R = shape.rows, row = 30;
                    pw = Math.max(30, Math.min(46, ((W - 2 * PAD) / C) * (W < 500 ? 0.62 : 0.74)));
                    ph = Math.min(18, row * 0.7);
                    const step = (W - 2 * PAD - 6 - pw) / (C - 1);
                    spotOf = ([c, share]) => [PAD + 3 + pw / 2 + c * step, PAD + 3 + share * R * row];
                    H = 2 * PAD + 6 + R * row;

                font = Math.min(11, ph * 0.62, pw / 2.7);

                const spots = adder
                    ? [...shape.inputSpots, ...shape.gateSpots, ...zs.map(z => [2 * bitNo(z), 4])]
                    : shape.spot;
                if (part === 1) {
                    const across = W - 2 * PAD, perRow = across / G >= 9 ? G : Math.ceil(G / 2);
                    const cs = Math.min(14, Math.floor(across / perRow)), rows = Math.ceil(G / perRow);
                    strip = { cs, perRow, left: (W - perRow * cs) / 2, top: H + 4 };
                    H = strip.top + rows * cs + (rows - 1) * 4 + PAD;
                }
                const cols = W / 4, rows = Math.ceil(H / 4);
                grid.size(cols, rows, 4, rows * 4);
                const c = grid.cell;
                X = []; Y = [];
                bends = new Map();
                spots.forEach((s, u) => {
                    const [x, y] = spotOf(s);

                    Y[u] = y / c - 0.5;

            };

            // A wire that would run behind another gate bends around it, worked out once per pair of spots.
            // With no room to bend, an adder's wire is drawn over the gates instead, so a swapped wire never
            // looks like it goes into the gate it passes.
            let bends = new Map(), later = [];
            const bendFor = (u, v) => {
                const key = u * N + v;
                if (bends.has(key)) return bends.get(key);
                const c = grid.cell, ax = X[u], ay = Y[u], bx = X[v], by = Y[v];
                const len = Math.hypot(bx - ax, by - ay) || 1, nx = -(by - ay) / len, ny = (bx - ax) / len;
                const hw = pw / 2 / c, hh = (ph / 2 - 2) / c;
                const hits = off => {

                    for (let s = 0.05; s < 0.96; s += 0.015) {
                        const x = (1 - s) * (1 - s) * ax + 2 * (1 - s) * s * cx + s * s * bx;
                        const y = (1 - s) * (1 - s) * ay + 2 * (1 - s) * s * cy + s * s * by;
                        for (let q = 0; q < N; q++) if (q !== u && q !== v && Math.abs(x - X[q]) < hw && Math.abs(y - Y[q]) < hh) return true;
                    }

                    }

                else if (via) grid.curve([X[u], Y[u]], via, [X[v], Y[v]], color, width);
