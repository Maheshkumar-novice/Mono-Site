            const wiresOver = () => {
                // from the edge of one pill to the edge of the other, so it never crosses their names
                const c = grid.cell, hw = (pw / 2 + 1) / c, hh = (ph / 2 + 1) / c;
                for (const [[ax, ay], [bx, by], color, width] of later) {
                    const dx = bx - ax, dy = by - ay, end = Math.min(Math.abs(dx) > 1e-9 ? hw / Math.abs(dx) : 1, Math.abs(dy) > 1e-9 ? hh / Math.abs(dy) : 1);
                    if (end < 0.5) grid.line([[ax + dx * end, ay + dy * end], [bx - dx * end, by - dy * end]], color, width);
                }
                later = [];
            };
            const ring = (u, color, dash = null, width = 2) => grid.pill(X[u], Y[u], pw + 8, ph + 8, null, color, width, dash, Math.min((ph + 8) / 2, 8));
            const pillText = (u, text, color) => grid.text(X[u], Y[u], text, color, font / grid.cell);

            if (part === 1) {
                const { value, firstAt, waiting, passes: P } = gatePasses(circuit);
                const fromGate = new Map(gates.map((g, i) => [g.out, i]));
                const knownBy = w => (inputAt.has(w) ? 0 : fromGate.has(w) ? firstAt[fromGate.get(w)] + 1 : Infinity);
                const nodeOf = w => (inputAt.has(w) ? inputAt.get(w) : I + fromGate.get(w));
                const wireOf = u => (u < I ? inputs[u].name : u < I + G ? gates[u - I].out : zs[u - I - G]);
                const zKnown = Math.max(...zs.map(knownBy));
                const output = parseInt(zs.map(z => value.get(z)).reverse().join(""), 2);

                // At time t: pass p, gate c of it being checked (cur, or -1 between passes), K checks done.
                const now = t => {
                    const p = Math.min(Math.floor(t), P), into = p < P ? t - p : 0, c = Math.min(G - 1, Math.floor(into * G));
                    return into > 0 ? { p, c, K: p * G + c, cur: c } : { p, c: 0, K: p * G, cur: -1 };
                };
                const clock = t => {
                    const { p, c, cur } = now(t);
                    if (cur >= 0) return `Pass ${p + 1} of ${P} · gate ${c + 1} of ${G}`;
                    if (p === 0) return "Start";
                    return `Pass ${p} of ${P} · ${waiting[p - 1] ? `${waiting[p - 1]} waiting` : "none waiting"}`;
                };
                const answer = t => (now(t).K >= zKnown ? `Output ${num(output)}` : "Output —");

                return {
                    line: "My code goes down the gate list (the strip below) again and again, and a gate works once both its inputs are set. Then the z wires make one binary number.",
                    sizeLabel: `${I} inputs · ${G} gates`,
                    max: P, speeds, speed, smooth: true,
                    start: 0,
                    layout,

                    draw(t) {
                        const { K, cur } = now(t);
                        const has = w => knownBy(w) <= K;
                        grid.clear(COLORS.floor);

                        // wires: no value yet, then 0s, then 1s on top
                        const look = [[COLORS["border-strong"], 1], [COLORS["text-muted"], 1.5], [COLORS.accent, 2]];
                        for (let pass = 0; pass < 3; pass++) {
                            for (const e of edges) {
                                const k = has(e.wire) ? 1 + value.get(e.wire) : 0;
                                if (k !== pass) continue;
                                wire(nodeOf(e.wire), e.to, ...look[k]);
                            }
                        }
                        for (let u = 0; u < N; u++) {
                            const w = wireOf(u);
                            if (has(w)) {
                                grid.pill(X[u], Y[u], pw, ph, valueFill(value.get(w)));
                                pillText(u, label(u), valueText(value.get(w)));
                            } else {
                                grid.pill(X[u], Y[u], pw, ph, COLORS.tile, COLORS["border-strong"]);
                                pillText(u, label(u), COLORS["text-muted"]);
                            }
                        }
                        wiresOver();

                        // the gate being checked: solid when both inputs are set, dashed when it has to wait
                        if (cur >= 0) {
                            const g = gates[cur];
                            ring(I + cur, COLORS.gold, has(g.a) && has(g.b) ? null : [3, 3]);
                        }

                        // the list of gates, in the order my code goes through them
                        const { cs, perRow, left, top } = strip, c = grid.cell;
                        for (let i = 0; i < G; i++) {
                            const x = (left + (i % perRow) * cs + cs / 2) / c - 0.5, y = (top + Math.floor(i / perRow) * (cs + 4) + cs / 2) / c - 0.5;
                            const on = firstAt[i] < K, size = cs - 2;
                            grid.pill(x, y, size, size, on ? valueFill(value.get(gates[i].out)) : COLORS.tile, on ? null : COLORS["border-strong"], 1, null, Math.min(2, size / 3));
                            if (i === cur) grid.pill(x, y, size + 5, size + 5, null, COLORS.gold, 2, null, 2);
                        }
                    },

                    clock,

                    readout(t) {
                        return { text: answer(t), hit: Math.floor(t) === P };
                    },

                    describe(t) {
                        return `${clock(t)}. ${answer(t)}.`;
                    },
                };
            }

            // Part 2, the way I did it by hand from the graphviz drawing: every z wire comes out of an XOR
            // (all but the last, the final carry), so a z from anything else swaps with the output of the
            // XOR in its bit that takes the carry in. Then one x XOR y feeds an OR, where its x AND y should:
            // swap those two. Then x + y = z.
            const { kind, bit } = shape;
            const states = [gates.map(g => g.out)], steps = [];
            const feeds = (outs, i) => gates.flatMap((g, j) => (g.a === outs[i] || g.b === outs[i] ? [j] : []));
            const swap = (i, j) => {
                const outs = states[states.length - 1].slice();
                steps.push({ kind: "swap", i, j, names: [outs[i], outs[j]] });
                [outs[i], outs[j]] = [outs[j], outs[i]];
                states.push(outs);
            };
            zs.forEach((z, k) => {
                const outs = states[states.length - 1], src = outs.indexOf(z);
                const ok = gates[src].op === (k === Z - 1 ? "OR" : "XOR");
                steps.push({ kind: "check", k, src, ok });
                if (!ok) {
                    const partner = gates.findIndex((g, i) => kind[i] === "xor2" && bit[i] === bitNo(z) && outs[i][0] !== "z");
                    if (partner >= 0) swap(src, partner);
                }
            });
            const outsNow = states[states.length - 1];
            const odd = gates.findIndex((g, i) => kind[i] === "xor1" && bit[i] > 0 && feeds(outsNow, i).some(j => gates[j].op === "OR"));
            if (odd >= 0) {
                steps.push({ kind: "odd", i: odd, to: feeds(outsNow, odd).filter(j => gates[j].op === "OR") });
                const partner = gates.findIndex((g, i) => kind[i] === "and1" && bit[i] === bit[odd]);
                if (partner >= 0) swap(odd, partner);
            }
            steps.push({ kind: "add" });
            const last = steps.length;

            const number = letter => inputs.reduce((s, w) => (w.name[0] === letter ? s + w.value * 2 ** bitNo(w.name) : s), 0);
            const sum = number("x") + number("y");
            const values = states.map(outs => wireValues(circuit, outs));
            const wrong = values.map(v => zs.map((z, k) => v.get(z) !== Math.floor(sum / 2 ** k) % 2));
            const swapsBefore = [0];
            steps.forEach((s, j) => swapsBefore.push(swapsBefore[j] + (s.kind === "swap" ? 1 : 0)));
            const swapSteps = steps.filter(s => s.kind === "swap");
            const namesAfter = s => swapSteps.slice(0, s).flatMap(x => x.names).sort();
            const SHOW = 0.3;     // a swap shows the two wires first, then moves them

            const onScreen = t => {
                const k = Math.floor(t), moving = t - k > 0 && k < last;
                return { k, j: moving ? k : k - 1, f: moving ? t - k : 1, moving };
            };
            const clock = t => {
                const { j } = onScreen(t);
                if (j < 0) return "Start";
                const s = steps[j];
                if (s.kind === "check") return `${zs[s.k]} from ${gates[s.src].op}`;
                if (s.kind === "swap") return `Swap ${s.names.slice().sort().join(" and ")}`;
                if (s.kind === "odd") return `${[gates[s.i].a, gates[s.i].b].sort().join(" XOR ")} feeds an OR`;
                return "Addition Successful!";
            };
            const answer = t => {
                const names = namesAfter(swapsBefore[onScreen(t).k]);
                return names.length ? `Wires ${names.join(",")}` : "Wires —";
            };

            return {
                line: "Four pairs of outputs are swapped. Every z but the last should come from an XOR, which finds three pairs; an x XOR y feeding an OR gives away the fourth.",
                sizeLabel: `${I} inputs · ${G} gates`,
                max: last, speeds, speed, smooth: true,
                start: 0,
                layout,

                draw(t) {
                    const { k, j, f, moving } = onScreen(t);
                    const s = swapsBefore[k], outs = states[s], value = values[s];
                    const step = j >= 0 ? steps[j] : null;
                    const swapping = step && step.kind === "swap" && moving ? step : null;
                    const p = swapping ? smooth(Math.max(0, (f - SHOW) / (1 - SHOW))) : 0;
                    const from = new Map(outs.map((w, i) => [w, I + i]));
                    // from gate u to gate v on a small bow, so the two names pass side by side
                    const mix = (u, v, q) => {
                        const dx = X[v] - X[u], dy = Y[v] - Y[u], len = Math.hypot(dx, dy) || 1, bow = (Math.sin(Math.PI * q) * ph * 1.1) / grid.cell;
                        return [X[u] + dx * q - (dy / len) * bow, Y[u] + dy * q + (dx / len) * bow];
                    };
                    const source = w => {
                        if (inputAt.has(w)) return [X[inputAt.get(w)], Y[inputAt.get(w)]];
                        const u = from.get(w);
                        if (swapping) {
                            const a = I + swapping.i, b = I + swapping.j;
                            if (u === a) return mix(a, b, p);
                            if (u === b) return mix(b, a, p);
                        }
                        return [X[u], Y[u]];
                    };
                    grid.clear(COLORS.floor);

                    // which wires stand out: the z being checked, the odd x XOR y, or the two being swapped
                    const gold = new Set(), white = new Set();
                    if (step && step.kind === "check") (step.ok ? white : gold).add(zs[step.k]);
                    if (step && step.kind === "odd") gold.add(outs[step.i]);
                    if (swapping) swapping.names.forEach(w => gold.add(w));
                    // a wire on the move runs straight from where its gate is now
                    const edge = (e, color, width) => {
                        if (swapping && swapping.names.includes(e.wire)) later.push([source(e.wire), [X[e.to], Y[e.to]], color, width]);
                        else wire(inputAt.has(e.wire) ? inputAt.get(e.wire) : from.get(e.wire), e.to, color, width);
                    };
                    for (const e of edges) if (!gold.has(e.wire) && !white.has(e.wire)) edge(e, COLORS["border-strong"], 1.25);
                    for (const e of edges) {
                        if (white.has(e.wire)) edge(e, COLORS["text-primary"], 2.5);
                        if (gold.has(e.wire)) edge(e, COLORS.gold, 2.5);
                    }

                    // x and y with their bits, the gates, and z with its bits (a dashed gold ring: not x + y's bit)
                    for (let u = 0; u < I; u++) {
                        const v = inputs[u].value;
                        grid.pill(X[u], Y[u], pw, ph, valueFill(v));
                        pillText(u, label(u), valueText(v));
                    }
                    const found = new Set(swapSteps.slice(0, s).flatMap(x => [x.i, x.j]));
                    for (let i = 0; i < G; i++) {
                        const u = I + i;
                        if (swapping && (i === swapping.i || i === swapping.j)) grid.pill(X[u], Y[u], pw, ph, COLORS["gold-faint"], COLORS.gold, 1);
                        else if (found.has(i)) {
                            grid.pill(X[u], Y[u], pw, ph, COLORS.gold);
                            pillText(u, outs[i], COLORS["bg-primary"]);
                        } else {
                            grid.pill(X[u], Y[u], pw, ph, COLORS.tile, COLORS["border-strong"]);
                            pillText(u, label(u), COLORS["text-secondary"]);
                        }
                    }
                    zs.forEach((z, q) => {
                        const u = I + G + q, v = value.get(z);
                        grid.pill(X[u], Y[u], pw, ph, valueFill(v));
                        pillText(u, z, valueText(v));
                        if (wrong[s][q]) ring(u, COLORS.gold, [3, 3], 1.5);
                    });

                    wiresOver();

                    // the two wire names on their way from one gate to the other
                    if (swapping) {
                        const a = I + swapping.i, b = I + swapping.j;
                        [[a, b, swapping.names[0]], [b, a, swapping.names[1]]].forEach(([u, v, name]) => {
                            const [x, y] = mix(u, v, p);
                            grid.pill(x, y, pw, ph, COLORS.gold);
                            grid.text(x, y, name, COLORS["bg-primary"], font / grid.cell);
                        });
                    }

                    if (step && step.kind === "check") {
                        const color = step.ok ? COLORS["text-primary"] : COLORS.gold;
                        ring(I + step.src, color);
                        ring(I + G + step.k, color);
                    }
                    if (step && step.kind === "odd") {
                        ring(I + step.i, COLORS.gold);
                        for (const q of step.to) ring(I + q, COLORS.gold, [3, 3]);
                    }
                },

                clock,

                readout(t) {
                    return { text: answer(t), hit: Math.floor(t) === last };
                },

                describe(t) {
                    return `${clock(t)}. ${answer(t)}.`;
                },
            };
        }

        /* ---------- the days ---------- */

        // Each part has one or more inputs; each input makes its scene the first time it's opened.
        const DAYS = [
            {
                day: 6,
                title: "Guard Gallivant",
                parts: [
                    { inputs: [
                        { name: "Example", make: () => day6Part1(EXAMPLE_6, { speeds: [2, 5, 10], speed: 5 }) },
                        { name: "Made-up", make: () => day6Part1(MADE_UP_6, { speeds: [5, 20, 50], speed: 20, big: true }) },
                    ] },
                    { inputs: [
                        { name: "Example", make: () => day6Part2(EXAMPLE_6, { speeds: [1, 2, 5], speed: 2 }) },
                        { name: "Made-up", make: () => day6Part2(MADE_UP_6, { speeds: [5, 15, 40], speed: 15, big: true }) },
                    ] },
                ],
            },
            {
                day: 9,
                title: "Disk Fragmenter",
                parts: [
                    { inputs: [
                        { name: "Example", make: () => day9(EXAMPLE_9, 1, { speeds: [1, 2, 5], speed: 2, labels: true }) },
                        { name: "Made-up", make: () => day9(MADE_UP_9, 1, { speeds: [5, 20, 50], speed: 20 }) },
                    ] },
                    { inputs: [
                        { name: "Example", make: () => day9(EXAMPLE_9, 2, { speeds: [0.5, 1, 2], speed: 1, labels: true }) },
                        { name: "Made-up", make: () => day9(MADE_UP_9, 2, { speeds: [2, 10, 25], speed: 10 }) },
                    ] },
                ],
            },
            {
                day: 14,
                title: "Restroom Redoubt",
                parts: [
                    { inputs: [{ name: "Example", make: day14Part1 }] },
                    { inputs: [{ name: "Made-up", make: day14Part2 }] },
                ],
            },
            {
                day: 15,
                title: "Warehouse Woes",
                parts: [
                    { inputs: [
                        { name: "Example", make: () => day15(EXAMPLE_15, 1, { speeds: [5, 30, 70], speed: 30, maxCell: 44, maxHeight: 440 }) },
                        { name: "Made-up", make: () => day15(MADE_UP_15(), 1, { speeds: [10, 60, 150], speed: 60, maxCell: 26, maxHeight: 520 }) },
                    ] },
                    { inputs: [
                        { name: "Example", make: () => day15(EXAMPLE_15, 2, { speeds: [5, 30, 70], speed: 30, maxCell: 40, maxHeight: 440 }) },
                        { name: "Made-up", make: () => day15(MADE_UP_15(), 2, { speeds: [10, 60, 150], speed: 60, maxCell: 21, maxHeight: 520 }) },
                    ] },
                ],
            },
            {
                day: 16,
                title: "Reindeer Maze",
                parts: [
                    { inputs: [
                        { name: "Example", make: () => day16(EXAMPLE_16, 1, { speeds: [1, 3, 6], speed: 3, maxCell: 36, maxHeight: 480 }) },
                        { name: "Made-up", make: () => day16(MADE_UP_16, 1, { speeds: [2, 6, 15], speed: 6, maxCell: 20, maxHeight: 560 }) },
                    ] },
                    { inputs: [
                        { name: "Example", make: () => day16(EXAMPLE_16, 2, { speeds: [1, 3, 6], speed: 3, maxCell: 36, maxHeight: 480 }) },
                        { name: "Made-up", make: () => day16(MADE_UP_16, 2, { speeds: [2, 6, 15], speed: 6, maxCell: 20, maxHeight: 560 }) },
                    ] },
                ],
            },
            {
                day: 23,
                title: "LAN Party",
                parts: [
                    { inputs: [
                        { name: "Example", make: () => day23(EXAMPLE_23, 1, { speeds: [2, 4, 8], speed: 4, maxSide: 456, nodeShare: 0.042, minR: 12, maxR: 19 }) },
                        { name: "Made-up", make: () => day23(MADE_UP_23(), 1, { speeds: [8, 16, 40], speed: 16, maxSide: 528, nodeShare: 0.027, minR: 8.5, maxR: 14 }) },
                    ] },
                    { inputs: [
                        { name: "Example", make: () => day23(EXAMPLE_23, 2, { speeds: [0.5, 1, 2], speed: 1, maxSide: 456, nodeShare: 0.042, minR: 12, maxR: 19 }) },
                        { name: "Made-up", make: () => day23(MADE_UP_23(), 2, { speeds: [1, 2, 4], speed: 2, maxSide: 528, nodeShare: 0.027, minR: 8.5, maxR: 14 }) },
                    ] },
                ],
            },
            {
                day: 24,
                title: "Crossed Wires",
                parts: [
                    { inputs: [
                        { name: "Example", make: () => day24(EXAMPLE_24, 1, { speeds: [0.1, 0.2, 0.4], speed: 0.2 }) },
                        { name: "Made-up", make: () => day24(MADE_UP_24(), 1, { speeds: [0.25, 0.5, 1], speed: 0.5, adder: true }) },
                    ] },
                    { inputs: [
                        { name: "Made-up", make: () => day24(MADE_UP_24(), 2, { speeds: [0.5, 1, 2], speed: 1, adder: true }) },
                    ] },
                ],
            },
        ];

        /* ---------- the player, shared by every day ---------- */

        const $ = id => document.getElementById(id);
        const els = {
            days: $("days"), parts: $("parts"), dayTitle: $("dayTitle"), puzzleLink: $("puzzleLink"), codeLink: $("codeLink"),
            partLine: $("partLine"), inputLabel: $("inputLabel"), inputs: $("inputs"), sizeLabel: $("sizeLabel"), clock: $("clock"), answer: $("answer"),
            restart: $("restart"), back: $("back"), play: $("play"), playIcon: $("playIcon"), fwd: $("fwd"),
            speeds: $("speeds"), goal: $("goal"), scrub: $("scrub"),
            chartBox: $("chartBox"), chart: $("chart"), chartTitle: $("chartTitle"), chartNote: $("chartNote"), tip: $("tip"),
        };

        const ICON_PLAY = "M8 5v14l11-7z";
        const ICON_PAUSE = "M7 5h4v14H7zM13 5h4v14h-4z";

        const state = {
            dayIndex: 0, partIndex: 0, inputIndex: 0,
            scene: null, scenes: new Map(),
            t: 0, playing: false, speed: 1, last: 0,
            seek: null,              // { from, to, start, ms } while "Find" runs
            hover: null,
        };

        function sceneFor(dayIndex, partIndex, inputIndex) {
            const key = [dayIndex, partIndex, inputIndex].join(":");
            if (!state.scenes.has(key)) state.scenes.set(key, DAYS[dayIndex].parts[partIndex].inputs[inputIndex].make());
            return state.scenes.get(key);
        }

        function shownTime() {
            return state.scene.smooth ? state.t : Math.floor(state.t);
        }

        function render() {
            const s = state.scene, t = shownTime(), whole = Math.floor(state.t);
            s.draw(t);
            const r = s.readout(t);
            els.clock.textContent = s.clock ? s.clock(t) : `Second ${num(whole)}`;
            els.answer.textContent = r.text;
            els.answer.classList.toggle("hit", r.hit);
            els.scrub.value = whole;
            grid.canvas.setAttribute("aria-label", s.describe(t));
            if (s.chart) drawChart();
        }

        function setPlaying(on) {
            state.playing = on;
            if (!on) state.seek = null;
            els.playIcon.setAttribute("d", on ? ICON_PAUSE : ICON_PLAY);
            els.play.setAttribute("aria-label", on ? "Pause" : "Play");
            els.play.title = on ? "Pause" : "Play";
            if (on) {
                state.last = performance.now();
                requestAnimationFrame(tick);
            }
        }

        const easeOut = p => 1 - Math.pow(1 - p, 3);

        function tick(now) {
            if (!state.playing) return;
            const s = state.scene;
            if (state.seek) {
                const { from, to, start, ms } = state.seek;
                const p = Math.min(1, Math.max(0, (now - start) / ms));
                state.t = p >= 1 ? to : Math.min(to, Math.floor(from + (to - from) * easeOut(p)));
                if (p >= 1) setPlaying(false);
            } else {
                // A frame's timestamp can be a little before the click that started playing; never go backwards.
                state.t += (Math.max(0, now - state.last) / 1000) * state.speed;
                if (state.t >= s.max) { state.t = s.max; setPlaying(false); }
            }
            state.last = now;
            render();
            if (state.playing) requestAnimationFrame(tick);
        }

        function jump(t) {
            setPlaying(false);
            state.t = Math.max(0, Math.min(state.scene.max, t));
            render();
        }

        function showPart(partIndex) {
            state.partIndex = partIndex;
            for (const b of els.parts.children) b.setAttribute("aria-selected", String(Number(b.dataset.part) === partIndex));

            // One input: a plain label. More than one: a small switch.
            const inputs = DAYS[state.dayIndex].parts[partIndex].inputs;
            els.inputLabel.hidden = inputs.length > 1;
            els.inputs.hidden = inputs.length < 2;
            els.inputLabel.textContent = inputs[0].name + " input";
            els.inputs.replaceChildren(...inputs.map((input, i) => {
                const b = document.createElement("button");
                b.type = "button";
                b.textContent = input.name;
                b.addEventListener("click", () => showInput(i));
                return b;
            }));
            showInput(0);
        }

        function showInput(inputIndex) {
            setPlaying(false);
            state.inputIndex = inputIndex;
            for (const [i, b] of [...els.inputs.children].entries()) b.setAttribute("aria-pressed", String(i === inputIndex));
            const s = state.scene = sceneFor(state.dayIndex, state.partIndex, inputIndex);
            state.t = s.start;
            state.speed = s.speed;

            els.partLine.textContent = s.line;
            els.sizeLabel.textContent = s.sizeLabel;
            els.scrub.max = s.max;

            els.speeds.replaceChildren(...s.speeds.map(v => {
                const b = document.createElement("button");
                b.type = "button";
                b.textContent = v + "×";
                b.setAttribute("aria-pressed", String(v === state.speed));
                b.addEventListener("click", () => {
                    state.speed = v;
                    for (const o of els.speeds.children) o.setAttribute("aria-pressed", String(o === b));
                });
                return b;
            }));

            els.goal.hidden = !s.goal;
            if (s.goal) els.goal.textContent = s.goal.label;

            els.chartBox.hidden = !s.chart;
            if (s.chart) {
                els.chartTitle.textContent = s.chart.title;
                els.chartNote.textContent = s.chart.note;
            }

            layout();
        }

        function showDay(dayIndex) {
            state.dayIndex = dayIndex;
            const d = DAYS[dayIndex];
            for (const b of els.days.children) b.setAttribute("aria-selected", String(Number(b.dataset.day) === dayIndex));
            history.replaceState(null, "", "#day" + d.day);
            els.dayTitle.textContent = `Day ${d.day}: ${d.title}`;
            els.puzzleLink.href = `https://adventofcode.com/2024/day/${d.day}`;
            els.codeLink.href = `https://github.com/Maheshkumar-novice/Advent-Of-Code-Solutions/tree/main/2024/Day-${String(d.day).padStart(2, "0")}`;
            els.parts.replaceChildren(...d.parts.map((_, i) => {
                const b = document.createElement("button");
                b.type = "button";
                b.setAttribute("role", "tab");
                b.dataset.part = i;
                b.textContent = `Part ${i + 1}`;
                b.addEventListener("click", () => showPart(i));
                return b;
            }));
            showPart(0);
        }

        function layout() {
            state.scene.layout();
            if (state.scene.chart) sizeChart();
            render();
        }

        /* ---------- the chart under the grid ---------- */

        const chart = { w: 0, h: 88, top: 6 };

        function sizeChart() {
            const dpr = window.devicePixelRatio || 1;
            chart.w = els.chart.clientWidth || els.chartBox.clientWidth;
            els.chart.style.height = chart.h + "px";
            els.chart.width = Math.round(chart.w * dpr);
            els.chart.height = Math.round(chart.h * dpr);
            chart.ctx = els.chart.getContext("2d");
            chart.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        // The highest value in the seconds that fall on one pixel column, and which second it was.
        function column(values, px) {
            const n = values.length;
            const a = Math.floor((px * n) / chart.w), b = Math.max(a + 1, Math.floor(((px + 1) * n) / chart.w));
            let best = -1, at = a;
            for (let i = a; i < b && i < n; i++) if (values[i] > best) { best = values[i]; at = i; }
            return { v: best, t: at };
        }

        function drawChart() {
            const c = state.scene.chart, ctx = chart.ctx, w = chart.w, h = chart.h, top = chart.top;
            const values = c.values, n = values.length;
            let max = 0;
            for (let i = 0; i < n; i++) if (values[i] > max) max = values[i];
            const y = v => h - 1 - ((h - 1 - top) * v) / max;

            ctx.clearRect(0, 0, w, h);

            // where we are now, behind the bars so it never hides the spike
            const nowX = Math.min(w - 1, Math.round((Math.floor(state.t) / n) * w));
            ctx.fillStyle = COLORS["text-muted"];
            ctx.fillRect(nowX, 0, 1, h);
            ctx.fillStyle = COLORS["text-primary"];
            ctx.fillRect(nowX - 2, 0, 5, 3);

            for (let px = 0; px < w; px++) {
                const { v } = column(values, px);
                if (v >= c.rule) continue;
                ctx.fillStyle = COLORS.bar;
                ctx.fillRect(px, y(v), 1, h - 1 - y(v));
            }
            // seconds at or past the rule, drawn wider and on top
            ctx.fillStyle = COLORS.accent;
            for (let px = 0; px < w; px++) {
                const { v } = column(values, px);
                if (v >= c.rule) ctx.fillRect(px - 1, y(v), 3, h - 1 - y(v));
            }

            // the rule line
            ctx.strokeStyle = COLORS["text-muted"];
            ctx.setLineDash([3, 3]);
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, Math.round(y(c.rule)) + 0.5);
            ctx.lineTo(w, Math.round(y(c.rule)) + 0.5);
            ctx.stroke();
            ctx.setLineDash([]);

            // baseline
            ctx.fillStyle = COLORS["border-strong"];
            ctx.fillRect(0, h - 1, w, 1);

            if (state.hover) {
                ctx.fillStyle = COLORS["text-muted"];
                ctx.fillRect(state.hover.px, 0, 1, h);
            }
        }

        function chartPoint(e) {
            const rect = els.chart.getBoundingClientRect();
            const px = Math.max(0, Math.min(chart.w - 1, Math.floor(e.clientX - rect.left)));
            return { px, ...column(state.scene.chart.values, px) };
        }

        function showTip(p) {
            state.hover = p;
            els.tip.hidden = false;
            els.tip.textContent = state.scene.chart.tip(p.t, p.v);
            const half = els.tip.offsetWidth / 2;
            els.tip.style.left = Math.max(0, Math.min(chart.w - 2 * half, p.px - half)) + "px";
            drawChart();
        }

        function hideTip() {
            state.hover = null;
            els.tip.hidden = true;
            if (state.scene.chart) drawChart();
        }

        let dragging = false;
        els.chart.addEventListener("pointerdown", e => {
            dragging = true;
            els.chart.setPointerCapture(e.pointerId);
            const p = chartPoint(e);
            jump(p.t);
            showTip(p);
        });
        els.chart.addEventListener("pointermove", e => {
            const p = chartPoint(e);
            if (dragging) jump(p.t);
            showTip(p);
        });
        els.chart.addEventListener("pointerup", () => { dragging = false; });
        els.chart.addEventListener("pointercancel", () => { dragging = false; hideTip(); });
        els.chart.addEventListener("pointerleave", () => { if (!dragging) hideTip(); });

        /* ---------- controls ---------- */

        els.play.addEventListener("click", () => {
            if (state.playing) return setPlaying(false);
            if (Math.floor(state.t) >= state.scene.max) state.t = 0;
            setPlaying(true);
        });
        els.restart.addEventListener("click", () => jump(0));
        els.back.addEventListener("click", () => jump(Math.ceil(state.t) - 1));
        els.fwd.addEventListener("click", () => jump(Math.floor(state.t) + 1));
        els.scrub.addEventListener("input", () => jump(Number(els.scrub.value)));

        els.goal.addEventListener("click", () => {
            const target = state.scene.goal.target;
            const from = Math.floor(state.t) < target ? Math.floor(state.t) : 0;
            setPlaying(false);
            state.t = from;
            state.seek = { from, to: target, start: performance.now(), ms: target - from > 50 ? 4500 : 1200 };
            setPlaying(true);
            state.seek.start = performance.now();
        });

        document.addEventListener("keydown", e => {
            if (e.target !== document.body || e.metaKey || e.ctrlKey || e.altKey) return;
            if (e.key === " ") { e.preventDefault(); els.play.click(); }
            else if (e.key === "ArrowRight") { e.preventDefault(); els.fwd.click(); }
            else if (e.key === "ArrowLeft") { e.preventDefault(); els.back.click(); }
        });

        let resizeTimer = 0;
        window.addEventListener("resize", () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(layout, 120);
        });

        els.days.replaceChildren(...DAYS.map((d, i) => {
            const b = document.createElement("button");
            b.type = "button";
            b.setAttribute("role", "tab");
            b.dataset.day = i;
            b.textContent = `Day ${d.day}`;
            b.addEventListener("click", () => showDay(i));
            return b;
        }));

        // #day14 opens Day 14.
        const fromLink = DAYS.findIndex(d => location.hash === "#day" + d.day);
        showDay(fromLink >= 0 ? fromLink : 0);
        document.fonts?.ready.then(() => render());
    })();
    </script>
</body>
</html>
